                const hexChars = 'abcdef';
                const suffixLength = Math.floor(Math.random() * 3); 
                let suffix = '';
                for (let i = 0; i < suffixLength; i++) {
                    suffix += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
                }
                
                const randomPrefixChars = '0123456789abcdef';
                let prefix = '';
                for (let i = 0; i < 12; i++) {
                    prefix += randomPrefixChars.charAt(Math.floor(Math.random() * randomPrefixChars.length));
                }
                
                const fullHash = prefix + targetDigit + suffix;
                const last5 = fullHash.slice(-5).toUpperCase().split('');
                const shortHash = '**' + fullHash.slice(-4);
                
                const now = new Date();
                const blockTime = now.toTimeString().split(' ')[0]; 
                
                return {
                    blockHeight: baseBlockHeight,
                    hash: fullHash,
                    shortHash: shortHash,
                    last5: last5,
                    blockTime: blockTime

                                {/* Unit Amounts Selection */}
                                <div>
                                    <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1.5 block">Select Base Amount</span>
                                    <div className="grid grid-cols-3 gap-1.5 font-mono">
                                        {[10, 50, 100, 500, 1000, 5000].map(amt => (
                                            <button
                                                key={amt}
                                                onClick={() => setSelectedUnit(amt)}
                                                className={`py-2 rounded-xl text-xs font-bold border transition-all cursor-pointer ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400 shadow-neon-gold' : 'bg-slate-900 border-slate-800 text-slate-300'}`}
                                            >
                                                ৳{amt}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Multiplier Stepper */}
                                <div>
                                    <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1.5 block">Multiplier</span>
                                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5 font-mono">
                                        {[1, 5, 10, 20, 50, 100].map(m => (
                                            <button
                                                key={m}
                                                onClick={() => setMultiplier(m)}
                                                className={`py-1.5 rounded-xl text-xs font-bold border transition-all cursor-pointer ${multiplier === m ? 'bg-emerald-500 text-slate-950 border-emerald-500 shadow-neon-green' : 'bg-slate-900 border-slate-800 text-slate-300'}`}
                                            >
                                                X{m}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex justify-between items-center pt-2.5 border-t border-slate-800">
                                    <div>
                                        <span className="text-[9.5px] text-slate-400 block font-mono">Total Stake:</span>
                                        <span className="text-xl sm:text-2xl font-black text-emerald-400 font-mono">৳{formatMoney(Number(selectedUnit) * Number(multiplier))}</span>
                                    </div>
                                    <button onClick={confirmBetPlacement} className="px-6 py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green active:scale-95 transition-all cursor-pointer">Confirm Bet</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* POPUP RESULT */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1000] flex flex-col items-center justify-center p-5 animate-fade-in font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border border-amber-500/60 rounded-3xl p-5 text-center shadow-2xl overflow-hidden">
                                <div className="text-4xl mb-1.5">{popupType === 'win' ? '🎉' : '💔'}</div>
                                <h2 className="text-2xl font-black text-amber-400 tracking-wider font-mono">{popupType === 'win' ? 'YOU WON!' : 'TRY AGAIN!'}</h2>
                                <span className="text-2xl font-black text-yellow-300 tracking-tight block mt-2 font-mono">৳{formatMoney(popupAmount)}</span>
                                <button onClick={() => setShowResultPopup(false)} className="mt-5 w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold cursor-pointer">
                                    Continue
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );

            function renderSharedNav() {
                return (
                    <div className="bg-[#0b101c] border-b border-slate-800/80 py-2.5 px-4 flex justify-between items-center relative z-20 shadow-2xl flex-shrink-0 font-sans">
                        <button onClick={() => { setView('home'); setActiveNav('home'); }} className={`flex flex-col items-center space-y-1 cursor-pointer ${activeNav === 'home' ? 'text-amber-400' : 'text-slate-400'}`}>
                            <Icon name="home" className="w-4.5 h-4.5" />
                            <span className="text-[9.5px] font-black">Home</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('activity'); }} className={`flex flex-col items-center space-y-1 cursor-pointer ${activeNav === 'activity' ? 'text-amber-400' : 'text-slate-400'}`}>
                            <Icon name="gift" className="w-4.5 h-4.5" />
                            <span className="text-[9.5px] font-black">Activity</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('promotion'); }} className={`flex flex-col items-center space-y-1 cursor-pointer ${activeNav === 'promotion' ? 'text-amber-400' : 'text-slate-400'}`}>
                            <Icon name="percent" className="w-4.5 h-4.5" />
                            <span className="text-[9.5px] font-black">Promo</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('account'); }} className={`flex flex-col items-center space-y-1 relative cursor-pointer ${activeNav === 'account' ? 'text-amber-400' : 'text-slate-400'}`}>
                            <Icon name="user" className="w-4.5 h-4.5" />
                            {hasPendingWithdraw && <span className="absolute top-0 right-0.5 w-2 h-2 bg-amber-400 rounded-full animate-ping"></span>}
                            <span className="text-[9.5px] font-black">VIP</span>
                        </button>
                    </div>
                );
            }
        }

        function formatTimeToSplit(totalSeconds) {
            const safeSeconds = Math.max(0, Math.floor(totalSeconds));
            const mins = Math.floor(safeSeconds / 60);
            const secs = safeSeconds % 60;
            const mString = String(mins).padStart(2, '0');
            const sString = String(secs).padStart(2, '0');
            return [mString[0], mString[1], ':', sString[0], sString[1]];
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
