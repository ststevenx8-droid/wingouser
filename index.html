            let suffix = '';
            for (let i = 0; i < suffixLength; i++) {
                suffix += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
            }
            
            const randomPrefixChars = '0123456789abcdef';
            let prefix = '';
            for (let i = 0; i < 12; i++) {
                prefix += randomPrefixChars.charAt(Math.floor(Math.random() * randomPrefixChars.length));
            }
            
            const fullHash = prefix + targetDigit + suffix;
            const last5 = fullHash.slice(-5).toUpperCase().split('');
            const shortHash = '**' + fullHash.slice(-4);
            
            const now = new Date();
            const blockTime = now.toTimeString().split(' ')[0]; 
            
            return {
                blockHeight: baseBlockHeight,
                hash: fullHash,
                shortHash: shortHash,
                last5: last5,
                blockTime: blockTime
            };
        };

                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="bg-[#191f2c] p-4 rounded-2xl space-y-4 border border-slate-800/80">
                                        {!chickenActive ? (
                                            <button onClick={startChickenGame} className="w-full py-3 bg-[#18b660] hover:bg-[#149d4e] active:scale-95 transition-all text-white font-black uppercase text-xs rounded-xl shadow-lg font-sans">
                                                Play Game
                                            </button>
                                        ) : (
                                            <div className="grid grid-cols-2 gap-2 w-full font-sans">
                                                <button disabled={chickenJumping} onClick={triggerRealJump} className="py-3 bg-[#fccd11] text-slate-950 font-black uppercase text-[10px] rounded-xl tracking-wider">
                                                    Jump Next
                                                </button>
                                                <button onClick={() => handleChickenCashout()} className="py-3 bg-[#e2136e] text-white font-black uppercase text-[10px] rounded-xl tracking-wider">
                                                    Cashout
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* DETAIL MODAL FOR PROMO BANNERS */}
                    {promoModal.isOpen && (
                        <div className="absolute inset-0 bg-black/85 z-[1050] flex flex-col items-center justify-center p-5 animate-fade-in font-sans">
                            <div className="relative w-full max-w-sm bg-gradient-to-b from-[#192231] to-[#0d121a] border border-amber-500/40 rounded-3xl p-5 text-white shadow-2xl overflow-hidden space-y-3.5">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2.5">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xl">🎁</span>
                                        <h3 className="text-sm font-black text-amber-300">{promoModal.data?.title || 'Promotion Event Details'}</h3>
                                    </div>
                                    <button onClick={() => setPromoModal({ isOpen: false, data: null })} className="text-slate-400 hover:text-white">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-2 text-xs text-slate-300">
                                    <p className="text-slate-200 font-semibold">{promoModal.data?.subtitle}</p>
                                    <div className="p-3 bg-black/50 rounded-xl border border-slate-800 text-[11px] space-y-1.5 font-mono">
                                        <div className="flex justify-between"><span>Minimum Recharge:</span><span className="text-amber-400">৳100</span></div>
                                        <div className="flex justify-between"><span>Cashout Multiplier:</span><span className="text-emerald-400">Up to 120X</span></div>
                                        <div className="flex justify-between"><span>Settle Type:</span><span className="text-amber-300">Automatic / Instant</span></div>
                                    </div>
                                    <p className="text-[10px] text-slate-400 leading-relaxed">
                                        All bonus earnings will be credited directly to your available balance upon qualification. 24/7 Live telegram support is available for query resolution.
                                    </p>
                                </div>

                                <div className="pt-2">
                                    <button 
                                        onClick={() => {
                                            setPromoModal({ isOpen: false, data: null });
                                            setView('deposit');
                                        }}
                                        className="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider active:scale-95 transition-all shadow-md"
                                    >
                                        Deposit Now & Claim
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM BET MODAL */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-slate-900/60 z-[90] flex flex-col justify-start animate-fade-in font-sans">
                            <div className="bg-white rounded-b-[2rem] p-5 space-y-4 max-h-[90%] overflow-y-auto shadow-2xl border-b border-slate-200">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-bold text-slate-800 font-sans">Confirm Bet Details</h3>
                                    <button onClick={() => setIsBetSheetOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>
                                <div className="flex justify-between items-center pt-2 border-t border-slate-100 font-sans">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block">Total cost:</span>
                                        <span className="text-xl font-black text-emerald-600 font-mono">৳{(selectedUnit * multiplier).toFixed(2)}</span>
                                    </div>
                                    <button onClick={confirmBetPlacement} className="px-5 py-3 bg-gradient-to-r from-emerald-600 to-green-500 text-slate-950 font-black rounded-xl text-xs uppercase">Confirm Bet</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* POPUP RESULT */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/80 z-[1000] flex flex-col items-center justify-center p-6 animate-fade-in font-sans">
                            <div className="relative w-full max-w-sm bg-gradient-to-b from-[#192130] to-[#0c1017] border border-slate-800 rounded-3xl p-6 text-center shadow-2xl overflow-hidden">
                                <h2 className="text-3xl font-extrabold text-amber-400 tracking-wider font-sans">{popupType === 'win' ? 'YOU WON!' : 'TRY AGAIN!'}</h2>
                                <span className="text-3xl font-black text-[#fccd11] tracking-tight block mt-4 font-mono">৳{Number(popupAmount).toFixed(2)}</span>
                                <button onClick={() => setShowResultPopup(false)} className="mt-6 w-full py-3 bg-yellow-400 text-slate-950 font-black rounded-xl text-xs uppercase">
                                    Close
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );

            function renderSharedNav() {
                return (
                    <div className="bg-white border-b border-gray-200 py-3 px-6 flex justify-between items-center relative z-20 shadow-[0_2px_10px_rgba(0,0,0,0.03)] flex-shrink-0 font-sans font-semibold">
                        <button onClick={() => { setView('home'); setActiveNav('home'); }} className={`flex flex-col items-center space-y-1 ${activeNav === 'home' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="home" className="w-5 h-5" />
                            <span className="text-[10px] font-bold font-sans">Home</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('activity'); }} className={`flex flex-col items-center space-y-1 ${activeNav === 'activity' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="gift" className="w-5 h-5" />
                            <span className="text-[10px] font-bold font-sans">Activity</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('promotion'); }} className={`flex flex-col items-center space-y-1 ${activeNav === 'promotion' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="percent" className="w-5 h-5" />
                            <span className="text-[10px] font-bold font-sans">Promo</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('account'); }} className={`flex flex-col items-center space-y-1 relative ${activeNav === 'account' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="user" className="w-5 h-5" />
                            {hasPendingWithdraw && <span className="absolute top-0 right-0.5 w-2 h-2 bg-amber-500 rounded-full animate-ping"></span>}
                            <span className="text-[10px] font-bold font-sans">Account</span>
                        </button>
                    </div>
                );
            }
        }

        function formatTimeToSplit(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            const mString = String(mins).padStart(2, '0');
            const sString = String(secs).padStart(2, '0');
            return [mString[0], mString[1], ':', sString[0], sString[1]];
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
