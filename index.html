            const phaseRef = useRef(phase);
            const multRef = useRef(multiplier);

            useEffect(() => {

                const updateSize = () => {
                    if (canvas && canvas.parentElement) {
                        canvas.width = canvas.parentElement.clientWidth;
                        canvas.height = canvas.parentElement.clientHeight;
                    }
                };
                updateSize();

                const render = () => {
                    const width = canvas.width || 350;
                    const height = canvas.height || 220;
                    const currentPhase = phaseRef.current;
                    const currentMult = multRef.current;

                    ctx.clearRect(0, 0, width, height);

                    // Grid
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 1;
                    for (let x = 30; x < width; x += 35) {
                        ctx.beginPath(); ctx.setLineDash([2, 4]); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                    }
                    for (let y = 30; y < height; y += 35) {
                        ctx.beginPath(); ctx.setLineDash([2, 4]); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();

                    ctx.restore();

                        const cpY = height - 15;
                        const targetX = startX + (width - 70) * Math.min(1, progress * 1.05 + 0.12);
                        const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.08);

                        // Red curve fill
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.35)');
                        fillGrad.addColorStop(0.7, 'rgba(229, 30, 56, 0.06)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.beginPath(); ctx.moveTo(startX, startY); ctx.quadraticCurveTo(cpX, cpY, targetX, targetY); ctx.lineTo(targetX, height); ctx.lineTo(startX, height); ctx.closePath();
                        ctx.fillStyle = fillGrad; ctx.fill(); ctx.restore();

                        // Red line
                        ctx.save();
                        ctx.shadowColor = '#e51e38'; ctx.shadowBlur = 15; ctx.strokeStyle = '#e51e38'; ctx.lineWidth = 3.5;
                        ctx.beginPath(); ctx.moveTo(startX, startY); ctx.quadraticCurveTo(cpX, cpY, targetX, targetY); ctx.stroke(); ctx.restore();

                        // Sparks
                        if (currentPhase === 'flying') {
                            if (Math.random() < 0.7) {
                                particlesRef.current.push({
                                    x: targetX - 6, y: targetY + 6,
                                    vx: -Math.random() * 2.5 - 1.2, vy: Math.random() * 2 + 0.3,
                                    size: Math.random() * 3 + 1.5, alpha: 1.0, color: '#e51e38'
                                });
                            }
                        }

                        particlesRef.current.forEach((p, idx) => {
                            p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                            if (p.alpha <= 0) { particlesRef.current.splice(idx, 1); return; }
                            ctx.save(); ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                        });

                        // Fighter Jet
                        if (currentPhase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY); ctx.rotate(-Math.PI / 7);
                            ctx.shadowColor = '#e51e38'; ctx.shadowBlur = 12; ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(14, 0); ctx.quadraticCurveTo(6, -6, -8, -5); ctx.lineTo(-11, -8); ctx.lineTo(-9, -2); ctx.lineTo(-11, 2); ctx.lineTo(-9, 8); ctx.lineTo(-8, 5); ctx.quadraticCurveTo(6, 6, 14, 0);
                            ctx.closePath(); ctx.fill(); ctx.restore();
                        }
                    }

                    animId = requestAnimationFrame(render);
                };

                animId = requestAnimationFrame(render);
                return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', updateSize); };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />;

                                        <div 
                                            key={i} 
                                            onClick={() => {
                                                if (currentUser) {
                                                    const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                    db.ref('users/' + san).update({ avatar: url });
                                                    setCurrentUser(p => ({ ...p, avatar: url }));
                                                    setShowAvatarModal(false);
                                                    showToast('অবতার পরিবর্তন হয়েছে!', 'success');
                                                }
                                            }}
                                            className="w-full h-18 rounded-2xl overflow-hidden border border-slate-700 hover:border-amber-400 cursor-pointer"
                                        >
                                            <img src={url} alt={`Avatar ${i}`} className="w-full h-full object-cover" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM LOTTERY BET MODAL */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-black/80 z-[90] flex flex-col justify-end font-sans backdrop-blur-sm">
                            <div className="bg-[#0f172a] rounded-t-[2rem] p-4 space-y-3 border-t border-slate-800 text-white safe-bottom">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Selection: <strong className="text-amber-400">{betValue}</strong></span>
                                    <button onClick={() => setIsBetSheetOpen(false)}><Icon name="x" className="w-4 h-4 text-slate-400" /></button>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                    {[10, 50, 100, 500].map(amt => (
                                        <button key={amt} onClick={() => setSelectedUnit(amt)} className={`py-1.5 rounded-xl text-xs font-bold border ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400' : 'bg-slate-900 border-slate-800'}`}>৳{amt}</button>
                                    ))}
                                </div>
                                <button onClick={() => { setBalance(prev => prev - selectedUnit); showToast(`Bet placed!`, 'success'); setIsBetSheetOpen(false); }} className="w-full py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green">
                                    Confirm (৳{selectedUnit})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* BIG WIN CELEBRATION POPUP */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1000] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel-gold border-2 border-amber-400/80 rounded-3xl p-5 text-center shadow-2xl space-y-3">
                                <div className="text-5xl animate-bounce">🏆</div>
                                <h2 className="text-xl font-black text-gradient-gold font-mono uppercase">CASHOUT SUCCESS!</h2>
                                <div className="p-2.5 bg-black/60 rounded-2xl border border-amber-400/40">
                                    <span className="text-2xl font-black text-yellow-300 font-mono block">৳{formatMoney(popupAmount)}</span>
                                </div>
                                <button onClick={() => setShowResultPopup(false)} className="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold">Collect Winnings</button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
