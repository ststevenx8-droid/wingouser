        // --- AVIATOR RED CANVAS ENGINE ---
        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    // Grid
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.lineWidth = 1;
                    for (let x = 30; x < width; x += 35) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = 30; y < height; y += 35) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (phase === 'flying' || phase === 'crashed') {
                        const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 6.5));
                        const startX = 20;
                        const startY = height - 20;
                        const cpX = width * 0.4;
                        const cpY = height - 15;
                        const targetX = startX + (width - 70) * Math.min(1, progress * 1.05 + 0.12);
                        const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.08);

                        // Red fill under curve
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.35)');
                        fillGrad.addColorStop(0.7, 'rgba(229, 30, 56, 0.06)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        // Glowing curve line
                        ctx.save();
                        ctx.shadowColor = '#e51e38';
                        ctx.shadowBlur = 15;
                        ctx.strokeStyle = '#e51e38';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        // Red Jet Exhaust Sparks
                        if (phase === 'flying') {
                            if (Math.random() < 0.75) {
                                particlesRef.current.push({
                                    x: targetX - 6,
                                    y: targetY + 6,
                                    vx: -Math.random() * 2.5 - 1.2,
                                    vy: Math.random() * 2 + 0.3,
                                    size: Math.random() * 3 + 1.5,
                                    alpha: 1.0,
                                    color: Math.random() > 0.3 ? '#e51e38' : '#ff4d64'
                                });
                            }
                        }

                        particlesRef.current.forEach((p, idx) => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= 0.04;
                            if (p.alpha <= 0) {
                                particlesRef.current.splice(idx, 1);
                                return;
                            }
                            ctx.save();
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });

                        // Fighter Jet
                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 7);

                            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
                            glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                            glow.addColorStop(0.3, 'rgba(229, 30, 56, 0.85)');
                            glow.addColorStop(1, 'rgba(229, 30, 56, 0)');
                            ctx.fillStyle = glow;
                            ctx.beginPath();
                            ctx.arc(0, 0, 24, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.shadowColor = '#e51e38';
                            ctx.shadowBlur = 12;
                            ctx.fillStyle = '#ffffff';

                            ctx.beginPath();
                            ctx.moveTo(14, 0);
                            ctx.quadraticCurveTo(6, -6, -8, -5);
                            ctx.lineTo(-11, -8);
                            ctx.lineTo(-9, -2);
                            ctx.lineTo(-11, 2);
                            ctx.lineTo(-9, 8);
                            ctx.lineTo(-8, 5);
                            ctx.quadraticCurveTo(6, 6, 14, 0);
                            ctx.closePath();
                            ctx.fill();

                            ctx.restore();
                        }
                    }

                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return (
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />
            );
        };

                                                                key={val} 
                                                                onClick={() => setWithdrawAmount(val)} 
                                                                className={`py-2 rounded-xl border text-xs font-bold cursor-pointer ${withdrawAmount === val ? 'bg-emerald-600 text-white border-emerald-400 font-black shadow-neon-green' : 'bg-slate-900 border-slate-800 text-slate-300'}`}
                                                            >
                                                                ৳{val}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="text-[10px] text-slate-400 uppercase font-bold font-mono block mb-1">Withdraw Amount (উত্তোলনের পরিমাণ):</label>
                                                    <input 
                                                        type="number" 
                                                        placeholder="টাকার পরিমাণ (Min 300)" 
                                                        value={withdrawAmount} 
                                                        onChange={e => setWithdrawAmount(e.target.value)} 
                                                        className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white focus:ring-1 focus:ring-emerald-400" 
                                                    />
                                                </div>

                                                <div>
                                                    <label className="text-[10px] text-slate-400 uppercase font-bold font-mono block mb-1">Receiver bKash Personal Number (বিকাশ পার্সোনাল নাম্বার):</label>
                                                    <input 
                                                        type="tel" 
                                                        placeholder="017XXXXXXXX" 
                                                        value={withdrawNumber} 
                                                        onChange={e => setWithdrawNumber(e.target.value)} 
                                                        className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white focus:ring-1 focus:ring-emerald-400" 
                                                    />
                                                </div>

                                                <button 
                                                    type="submit" 
                                                    className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green active:scale-95 cursor-pointer"
                                                >
                                                    Confirm Cashout (৳{withdrawAmount})
                                                </button>
                                            </form>
                                        </>
                                    ) : (
                                        <div className="space-y-2.5">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase font-mono">Cashout Withdrawal Records</h3>
                                            {withdrawHistory.length === 0 ? (
                                                <div className="p-8 text-center glass-panel rounded-3xl text-slate-500 text-xs">
                                                    কোনো উত্তোলন রেকর্ড পাওয়া যায়নি।
                                                </div>
                                            ) : (
                                                withdrawHistory.map((item, idx) => (
                                                    <div key={item.id || idx} className="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-1.5 text-xs font-mono">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-black text-emerald-400 text-sm">৳{formatMoney(item.amount)}</span>
                                                            <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                                                                item.status === 'Approved' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 
                                                                (item.status === 'Rejected' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse')
                                                            }`}>
                                                                {item.status === 'Approved' ? 'সফল (Sent)' : (item.status === 'Rejected' ? 'বাতিল' : 'প্রক্রিয়াধীন (Pending)')}
                                                            </span>
                                                        </div>
                                                        <div className="text-[10px] text-slate-400 flex justify-between pt-1 border-t border-slate-800">
                                                            <span>To bKash: {item.receiverNumber}</span>
                                                            <span>{item.timestamp}</span>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>

                    {/* AVATAR PICKER MODAL */}
                    {showAvatarModal && (
                        <div className="absolute inset-0 bg-black/85 z-[1050] flex flex-col items-center justify-center p-4 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border border-amber-500/50 rounded-3xl p-5 text-white shadow-2xl space-y-3.5">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="text-sm font-black text-amber-300 font-mono">Select VIP Avatar</h3>
                                    <button onClick={() => setShowAvatarModal(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <div className="grid grid-cols-3 gap-2.5 py-2">
                                    {PRESET_AVATARS.map((url, i) => (
                                        <div 
                                            key={i} 
                                            onClick={() => {
                                                if (currentUser) {
                                                    const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                    db.ref('users/' + san).update({ avatar: url });
                                                    setCurrentUser(p => ({ ...p, avatar: url }));
                                                    setShowAvatarModal(false);
                                                    showToast('অবতার পরিবর্তন হয়েছে!', 'success');
                                                }
                                            }}
                                            className="w-full h-20 rounded-2xl overflow-hidden border-2 border-slate-800 hover:border-amber-400 cursor-pointer shadow-md"
                                        >
                                            <img src={url} alt={`Avatar ${i}`} className="w-full h-full object-cover" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM WINGO BET MODAL */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-black/80 z-[90] flex flex-col justify-end font-sans backdrop-blur-sm">
                            <div className="bg-[#0f172a] rounded-t-[2rem] p-5 space-y-3.5 border-t border-slate-800 text-white safe-bottom">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Bet: <strong className="text-amber-400">{betValue}</strong></span>
                                    <button onClick={() => setIsBetSheetOpen(false)} className="cursor-pointer"><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                    {[10, 50, 100, 500].map(amt => (
                                        <button key={amt} onClick={() => setSelectedUnit(amt)} className={`py-2 rounded-xl text-xs font-bold border cursor-pointer ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400' : 'bg-slate-900 border-slate-800'}`}>৳{amt}</button>
                                    ))}
                                </div>
                                <button onClick={() => { setBalance(prev => prev - selectedUnit); showToast(`Bet placed!`, 'success'); setIsBetSheetOpen(false); }} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green cursor-pointer">
                                    Confirm (৳{selectedUnit})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* BIG WIN CELEBRATION POPUP */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1000] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel-glow border-2 border-amber-400/80 rounded-3xl p-6 text-center shadow-2xl space-y-3">
                                <div className="text-5xl animate-bounce">🏆</div>
                                <h2 className="text-2xl font-black text-gradient-gold font-mono uppercase">
                                    CASHOUT SUCCESS!
                                </h2>
                                <div className="p-3 bg-black/60 rounded-2xl border border-amber-400/40">
                                    <span className="text-3xl font-black text-yellow-300 font-mono block">
                                        ৳{formatMoney(popupAmount)}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => setShowResultPopup(false)} 
                                    className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold cursor-pointer"
                                >
                                    Collect Winnings
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
