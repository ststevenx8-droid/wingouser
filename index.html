        // --- 1,000 ROUNDS MASSIVE HISTORY GENERATOR ---
        const generate1000GameHistory = (basePeriod, count = 1000) => {
            const list = [];
            let currentP = BigInt(basePeriod);
            for (let i = 0; i < count; i++) {
                const pStr = String(currentP - BigInt(i));
                const dig = Math.floor(Math.random() * 10);
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const d3 = Math.floor(Math.random() * 6) + 1;
                const sum = d1 + d2 + d3;
                list.push({
                    period: pStr,
                    number: dig,
                    size: dig >= 5 ? 'Big' : 'Small',
                    color: dig === 0 ? 'violet-red' : (dig === 5 ? 'violet-green' : ([1,3,7,9].includes(dig) ? 'green' : 'red')),
                    shortHash: '**' + Math.random().toString(16).substring(2, 6),
                    dice: [d1, d2, d3],
                    sum: sum,
                    k3Size: sum >= 11 ? 'Big' : 'Small',
                    parity: sum % 2 === 0 ? 'Even' : 'Odd'
                });
            }
            return list;
        };

        // --- WEB AUDIO ENGINE ---
        const aviatorAudio = {
            ctx: null,
            flightOsc: null,
            flightGain: null,
            init() {
                if (!this.ctx) {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    } catch (e) {}
                }
            },
            startEngineSound() {
                this.init();
                if (!this.ctx) return;
                try {
                    this.stopEngineSound();
                    const ctx = this.ctx;
                    this.flightOsc = ctx.createOscillator();
                    this.flightGain = ctx.createGain();
                    
                    this.flightOsc.type = 'sawtooth';
                    this.flightOsc.frequency.setValueAtTime(80, ctx.currentTime);
                    
                    this.flightGain.gain.setValueAtTime(0.01, ctx.currentTime);
                    this.flightGain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 1);

                    this.flightOsc.connect(this.flightGain);
                    this.flightGain.connect(ctx.destination);
                    this.flightOsc.start();
                } catch(e) {}
            },
            updateEnginePitch(mult) {
                if (this.flightOsc && this.ctx) {
                    try {
                        const targetFreq = Math.min(420, 80 + (mult - 1) * 35);
                        this.flightOsc.frequency.setValueAtTime(targetFreq, this.ctx.currentTime);
                    } catch(e) {}
                }
            },
            stopEngineSound() {
                if (this.flightOsc) {
                    try {
                        this.flightOsc.stop();
                        this.flightOsc.disconnect();
                    } catch(e) {}
                    this.flightOsc = null;
                }
            },
            playCrashSound() {
                this.stopEngineSound();
                this.init();
                if (!this.ctx) return;
                try {
                    const ctx = this.ctx;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(260, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.45);
                    gain.gain.setValueAtTime(0.18, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.48);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } catch(e) {}
            }

        // --- ✈️ ORIGINAL WORKING AVIATOR RED FLIGHT CANVAS ---
        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    // Grid
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 1;
                    for (let x = 32; x < width; x += 32) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = 32; y < height; y += 32) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (phase === 'flying' || phase === 'crashed') {
                        const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 7.5));
                        const startX = 20;
                        const startY = height - 20;
                        const cpX = width * 0.42;
                        const cpY = height - 20;
                        const targetX = startX + (width - 65) * Math.min(1, progress * 1.1 + 0.1);
                        const targetY = startY - (height - 55) * Math.min(0.9, Math.pow(progress, 0.9) + 0.06);

                        // Red Gradient Fill
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.32)');
                        fillGrad.addColorStop(0.6, 'rgba(229, 30, 56, 0.08)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        // Glowing Crimson Red Line
                        ctx.save();
                        ctx.shadowColor = '#e51e38';
                        ctx.shadowBlur = 18;
                        ctx.strokeStyle = '#e51e38';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        // Red Sparks
                        if (phase === 'flying') {
                            if (Math.random() < 0.8) {
                                particlesRef.current.push({
                                    x: targetX - 5,
                                    y: targetY + 5,
                                    vx: -Math.random() * 2.2 - 0.8,
                                    vy: Math.random() * 1.8 + 0.4,
                                    size: Math.random() * 3 + 1.5,
                                    alpha: 1.0,
                                    color: Math.random() > 0.4 ? '#e51e38' : '#ff2a44'
                                });
                            }
                        }

                        particlesRef.current.forEach((p, idx) => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= 0.04;
                            if (p.alpha <= 0) {
                                particlesRef.current.splice(idx, 1);
                                return;
                            }
                            ctx.save();
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.shadowColor = '#e51e38';
                            ctx.shadowBlur = 6;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });

                        // Fighter Jet
                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 6.5);

                            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
                            glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                            glow.addColorStop(0.3, 'rgba(229, 30, 56, 0.8)');
                            glow.addColorStop(0.7, 'rgba(229, 30, 56, 0.25)');
                            glow.addColorStop(1, 'rgba(229, 30, 56, 0)');
                            ctx.fillStyle = glow;
                            ctx.beginPath();
                            ctx.arc(0, 0, 26, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.shadowColor = '#e51e38';
                            ctx.shadowBlur = 14;
                            ctx.fillStyle = '#ffffff';

                            ctx.beginPath();
                            ctx.moveTo(13, 0);
                            ctx.quadraticCurveTo(5, -6, -7, -5);
                            ctx.lineTo(-10, -8);
                            ctx.lineTo(-8, -2);
                            ctx.lineTo(-10, 2);
                            ctx.lineTo(-8, 8);
                            ctx.lineTo(-7, 5);
                            ctx.quadraticCurveTo(5, 6, 13, 0);
                            ctx.closePath();
                            ctx.fill();

                            ctx.restore();
                        }
                    }

                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return (
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />
            );
        };

                                    >
                                        <Icon name="upload" className="w-4 h-4" />
                                        <span>মোবাইল গ্যালারি থেকে ছবি দিন</span>
                                    </button>
                                    <span className="text-[9.5px] text-slate-400 block">ক্যামেরা বা গ্যালারি থেকে যেকোনো ছবি বেছে নিন</span>
                                </div>

                                <div className="pt-2 border-t border-slate-800 space-y-2">
                                    <span className="text-[10px] text-slate-400 font-mono uppercase block">অথবা প্রিসেট অবতার বেছে নিন:</span>
                                    <div className="grid grid-cols-4 gap-2">
                                        {PRESET_AVATARS.map((url, i) => (
                                            <div 
                                                key={i} 
                                                onClick={() => {
                                                    if (currentUser) {
                                                        const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                        db.ref('users/' + san).update({ avatar: url });
                                                        setCurrentUser(p => ({ ...p, avatar: url }));
                                                        setShowAvatarModal(false);
                                                        showToast('অবতার সেট হয়েছে!', 'success');
                                                    }
                                                }}
                                                className="w-full h-16 rounded-xl overflow-hidden border border-slate-700 hover:border-amber-400 cursor-pointer shadow"
                                            >
                                                <img src={url} alt={`Avatar ${i}`} className="w-full h-full object-cover" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM LOTTERY BET MODAL */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-black/80 z-[90] flex flex-col justify-end font-sans backdrop-blur-sm">
                            <div className="bg-[#0f172a] rounded-t-[2rem] p-5 space-y-3.5 border-t border-slate-800 text-white safe-bottom">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Selection: <strong className="text-amber-400 uppercase">{betValue}</strong></span>
                                    <button onClick={() => setIsBetSheetOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                    {[10, 50, 100, 500].map(amt => (
                                        <button key={amt} onClick={() => setSelectedUnit(amt)} className={`py-1.5 rounded-xl text-xs font-bold border ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400' : 'bg-slate-900 border-slate-800'}`}>৳{amt}</button>
                                    ))}
                                </div>
                                <button onClick={() => { setBalance(prev => prev - selectedUnit); showToast(`Bet of ৳${selectedUnit} placed!`, 'success'); setIsBetSheetOpen(false); }} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green">
                                    Confirm Bet (৳{selectedUnit})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* BIG WIN CELEBRATION POPUP */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1000] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md animate-fade-in">
                            <div className="relative w-full max-w-sm glass-panel-glow border-2 border-amber-400/80 rounded-3xl p-6 text-center shadow-2xl overflow-hidden">
                                <div className="text-5xl mb-2">🏆</div>
                                <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 font-mono">
                                    BIG WIN CASHOUT!
                                </h2>
                                <div className="p-3 bg-black/60 rounded-2xl border border-amber-400/40 my-3">
                                    <span className="text-3xl font-black text-yellow-300 font-mono block">
                                        ৳{formatMoney(popupAmount)}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => setShowResultPopup(false)} 
                                    className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold cursor-pointer"
                                >
                                    Collect Winnings
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
