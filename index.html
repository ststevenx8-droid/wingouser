        const playAudioSound = (type) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.35);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.25);
                    });
                }

            const num = Number(val);

        };

        // Aviator Canvas Renderer
        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 9.0));
                    const startX = 20;
                    const startY = height - 20;
                    const cpX = width * 0.45;
                    const cpY = height - 20;
                    const targetX = startX + (width - 70) * Math.min(1, progress * 1.1 + 0.1);
                    const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.05);

                    if (phase === 'flying' || phase === 'crashed') {
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.45)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        ctx.save();
                        ctx.strokeStyle = '#e51e38';
                        ctx.shadowColor = '#e51e38';
                        ctx.shadowBlur = 15;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 8);
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(16, 0);
                            ctx.quadraticCurveTo(6, -7, -8, -6);
                            ctx.lineTo(-11, -9);
                            ctx.lineTo(-9, -2);
                            ctx.lineTo(-11, 2);
                            ctx.lineTo(-9, 9);
                            ctx.lineTo(-8, 6);
                            ctx.quadraticCurveTo(6, 7, 16, 0);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />;
        };

                    sum: sum,
                    k3Size: sum >= 11 ? 'Big' : 'Small',

            }
            return list;

                                        <div className={`h-24 rounded-xl jili-drum-gold flex items-center justify-center ${isSlotSpinning ? 'anim-slot-spinning' : ''}`}>
                                            <span className="text-lg font-black text-white font-mono bg-purple-700 px-2 py-1 rounded shadow">{specialReel}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-4 bg-black/90 p-3 rounded-2xl border border-yellow-500/50 flex items-center justify-between">
                                    <div className="flex space-x-1 font-mono">
                                        {[1, 5, 10, 20].map(b => (
                                            <button key={b} onClick={() => setMoneyComingBet(b)} className={`px-2.5 py-1 text-xs rounded-lg font-black ${moneyComingBet === b ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>৳{b}</button>
                                        ))}
                                    </div>
                                    <button 
                                        onClick={spinSlot} 
                                        disabled={isSlotSpinning}
                                        className="w-14 h-14 rounded-full jili-spin-btn flex flex-col items-center justify-center font-black text-slate-950 text-xs shadow-jili-glow cursor-pointer disabled:opacity-50 active:scale-90"
                                    >
                                        SPIN
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AVIATOR SPRIBE VIEW */}
                    {view === 'game_aviator' && (
                        <div className="flex-1 flex flex-col bg-[#080a10] justify-between overflow-hidden min-h-0 font-sans">
                            <div className="px-3.5 py-2.5 bg-[#0e111a] border-b border-slate-800 flex items-center justify-between flex-shrink-0">
                                <button onClick={() => setView('home')} className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-amber-400">Back</button>
                                <span className="text-red-500 font-black text-sm font-mono">AVIATOR SPRIBE ✈️</span>
                                <span className="text-xs font-black text-amber-400 font-mono">৳{formatMoney(balance)}</span>
                            </div>

                            <div className="px-3 py-1.5 bg-[#07080d] border-b border-slate-800/60 flex space-x-1.5 overflow-x-auto flex-shrink-0">
                                {aviatorHistory.map((item, i) => (
                                    <span key={i} className={`text-[9.5px] font-black font-mono px-2 py-0.5 rounded-full border ${item.mult >= 2 ? 'bg-purple-600/20 text-purple-300 border-purple-500/30' : 'bg-blue-600/20 text-blue-300 border-blue-500/30'}`}>{Number(item.mult).toFixed(2)}x</span>
                                ))}
                            </div>

                            <div className="flex-1 flex flex-col p-3 space-y-2.5 overflow-y-auto">
                                <div className="w-full h-52 bg-[#0b0e14] rounded-3xl border border-red-900/50 relative flex items-center justify-center overflow-hidden flex-shrink-0">
                                    <AviatorFlightCanvas phase={aviatorPhase} multiplier={aviatorMult} />
                                    {aviatorPhase === 'flying' && (
                                        <span className="text-4xl font-black font-mono text-white z-20">{aviatorMult.toFixed(2)}x</span>
                                    )}
                                    {aviatorPhase === 'waiting' && (
                                        <span className="text-xs font-black uppercase text-slate-300 font-mono z-20">NEXT ROUND IN {aviatorCountdown}s</span>
                                    )}
                                    {aviatorPhase === 'crashed' && (
                                        <span className="text-4xl font-black font-mono text-red-500 z-20 animate-bounce">{aviatorCrashPoint.toFixed(2)}x</span>
                                    )}
                                </div>

                                <div className="bg-[#10141f] p-3 rounded-2xl border border-slate-800 space-y-2">
                                    <div className="flex justify-between items-center text-xs font-mono text-slate-400">
                                        <span>Stake: ৳{aviatorStake}</span>
                                        <div className="flex space-x-1">
                                            {[10, 50, 100, 500].map(amt => (
                                                <button key={amt} onClick={() => setAviatorStake(amt)} className="px-2 py-0.5 bg-slate-800 text-slate-200 rounded">৳{amt}</button>
                                            ))}
                                        </div>
                                    </div>
                                    {aviatorPhase === 'waiting' ? (
                                        <button onClick={() => { setIsAviatorBetPlaced(true); setBalance(b => b - aviatorStake); alert('বেট প্লেস হয়েছে!'); }} disabled={isAviatorBetPlaced} className="w-full py-3 bg-emerald-500 text-slate-950 font-black text-xs rounded-xl uppercase font-mono">{isAviatorBetPlaced ? 'WAITING FLIGHT' : 'BET'}</button>
                                    ) : (
                                        <button onClick={() => { setIsAviatorCashedOut(true); const w = parseFloat((aviatorStake * aviatorMult).toFixed(2)); setBalance(b => b + w); alert(`৳${w} ক্যাশআউট সফল!`); }} disabled={!isAviatorBetPlaced || isAviatorCashedOut} className="w-full py-3 bg-amber-400 text-slate-950 font-black text-xs rounded-xl uppercase font-mono">{isAviatorCashedOut ? 'DONE ✓' : `CASHOUT ৳${formatMoney(aviatorStake * aviatorMult)}`}</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* WINGO VIEW */}
                    {view === 'game_wingo' && (
                        <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0 font-sans">
                            <div className="px-4 py-3 bg-[#0a2e16] text-white flex items-center justify-between border-b border-emerald-900/40 flex-shrink-0">
                                <button onClick={() => setView('home')} className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-amber-400">Back</button>
                                <span className="text-xs font-black tracking-widest uppercase font-mono text-gradient-gold">WINGO LIVE 🎲</span>
                                <span className="text-xs font-black text-amber-400 font-mono">৳{formatMoney(balance)}</span>
                            </div>

                            <div className="flex-1 px-3.5 py-3 space-y-3 overflow-y-auto">
                                <div className="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    {['30sec', '1min', '2min'].map(t => (
                                        <button key={t} onClick={() => setActiveGameTab(t)} className={`py-2 text-[11px] font-black rounded-xl ${activeGameTab === t ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}>{t.toUpperCase()}</button>
                                    ))}
                                </div>

                                <div className="glass-panel p-4 rounded-3xl border border-amber-500/40 flex justify-between items-center font-mono">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block uppercase">Period: {periods[activeGameTab]}</span>
                                        <span className="text-xs font-bold text-amber-300">Countdown</span>
                                    </div>
                                    <span className="text-3xl font-black text-yellow-400">{Math.floor(timers[activeGameTab] / 60)}:{String(timers[activeGameTab] % 60).padStart(2, '0')}</span>
                                </div>

                                <div className="grid grid-cols-3 gap-2">
                                    <button onClick={() => alert('বেট প্লেস হয়েছে (Green)!')} className="bg-emerald-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow">Green (2X)</button>
                                    <button onClick={() => alert('বেট প্লেস হয়েছে (Violet)!')} className="bg-purple-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow">Violet (4.5X)</button>
                                    <button onClick={() => alert('বেট প্লেস হয়েছে (Red)!')} className="bg-rose-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow">Red (2X)</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* K3 LOTTERY VIEW */}
                    {view === 'game_k3' && (
                        <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0 font-sans">
                            <div className="px-4 py-3 bg-[#2e1502] text-white flex items-center justify-between border-b border-amber-900/40 flex-shrink-0">
                                <button onClick={() => setView('home')} className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-amber-400">Back</button>
                                <span className="text-xs font-black tracking-widest uppercase font-mono text-gradient-gold">K3 LOTTERY 🎲</span>
                                <span className="text-xs font-black text-amber-400 font-mono">৳{formatMoney(balance)}</span>
                            </div>

                            <div className="flex-1 px-3.5 py-3 space-y-3 overflow-y-auto">
                                <div className="glass-panel p-4 rounded-3xl border border-amber-500/40 flex justify-between items-center font-mono">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block uppercase">Period: {periods[activeGameTab]}</span>
                                        <span className="text-xs font-bold text-amber-300">K3 Draw</span>
                                    </div>
                                    <span className="text-3xl font-black text-yellow-400">{Math.floor(timers[activeGameTab] / 60)}:{String(timers[activeGameTab] % 60).padStart(2, '0')}</span>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => alert('বেট প্লেস হয়েছে (Small)!')} className="bg-sky-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow">Small (2X)</button>
                                    <button onClick={() => alert('বেট প্লেস হয়েছে (Big)!')} className="bg-amber-500 text-slate-950 py-3 rounded-2xl font-black text-xs uppercase shadow">Big (2X)</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PROFILE AVATAR CHANGE MODAL */}
                    {showAvatarModal && (
                        <div className="fixed inset-0 bg-black/85 z-[3000] flex flex-col items-center justify-center p-4 font-sans backdrop-blur-md">
                            <div className="w-full max-w-sm glass-panel border border-amber-500/50 rounded-3xl p-5 text-white space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="text-sm font-black text-amber-300 font-mono">প্রোফাইল ছবি পরিবর্তন</h3>
                                    <button onClick={() => setShowAvatarModal(false)} className="text-slate-400">
                                        <Icons.x className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <span className="text-xs text-slate-400 font-bold block">ডিফল্ট ছবি বাছাই করুন:</span>
                                    <div className="grid grid-cols-4 gap-2">
                                        {PRESET_AVATARS.map((imgUrl, idx) => (
                                            <div 
                                                key={idx} 
                                                onClick={() => {
                                                    if (currentUser) {
                                                        const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                        db.ref('users/' + san).update({ avatar: imgUrl });
                                                        setCurrentUser(p => ({ ...p, avatar: imgUrl }));
                                                        setShowAvatarModal(false);
                                                        alert('প্রোফাইল ছবি আপডেট হয়েছে!');
                                                    }
                                                }}
                                                className="w-14 h-14 rounded-2xl overflow-hidden border-2 border-slate-700 hover:border-amber-400 cursor-pointer"
                                            >
                                                <img src={imgUrl} alt="Preset" className="w-full h-full object-cover" />
                                            </div>
                                        ))}
                                    </div>

                                    <div className="pt-2 border-t border-slate-800">
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            ref={fileInputRef} 
                                            onChange={(e) => {
                                                const file = e.target.files[0];
                                                if (!file) return;
                                                const reader = new FileReader();
                                                reader.onload = (event) => {
                                                    const base64Img = event.target.result;
                                                    if (currentUser) {
                                                        const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                        db.ref('users/' + san).update({ avatar: base64Img });
                                                        setCurrentUser(p => ({ ...p, avatar: base64Img }));
                                                        setShowAvatarModal(false);
                                                        alert('গ্যালারি থেকে ছবি সফলভাবে আপলোড হয়েছে!');
                                                    }
                                                };
                                                reader.readAsDataURL(file);
                                            }} 
                                            className="hidden" 
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                            className="w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black text-xs uppercase rounded-xl flex items-center justify-center space-x-2 cursor-pointer shadow-neon-gold"
                                        >
                                            <Icons.upload className="w-4 h-4" />
                                            <span>মোবাইল গ্যালারি থেকে ছবি দিন</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
