                try {
                    const ctx = this.ctx;
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = f;
                        gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.28);
                        osc.start(ctx.currentTime + i * 0.06);
                        osc.stop(ctx.currentTime + i * 0.06 + 0.3);
                    });
                } catch(e) {}
            }
        };

        // --- 100% SLOW & LOW FLIGHT CANVAS TRAJECTORY ENGINE ---
        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    // Grid
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 1;
                    for (let x = 32; x < width; x += 32) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = 32; y < height; y += 32) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (phase === 'flying' || phase === 'crashed') {
                        const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 7.5));
                        const startX = 20;
                        const startY = height - 20;
                        const cpX = width * 0.42;
                        const cpY = height - 20;
                        const targetX = startX + (width - 65) * Math.min(1, progress * 1.1 + 0.1);
                        const targetY = startY - (height - 55) * Math.min(0.9, Math.pow(progress, 0.9) + 0.06);

                        // Fill Under Curve
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(245, 158, 11, 0.22)');
                        fillGrad.addColorStop(0.6, 'rgba(245, 158, 11, 0.06)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        // Golden Path
                        ctx.save();
                        ctx.shadowColor = '#f59e0b';
                        ctx.shadowBlur = 16;
                        ctx.strokeStyle = phase === 'crashed' ? '#ef4444' : '#fbbf24';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        // Exhaust Particles
                        if (phase === 'flying') {
                            if (Math.random() < 0.75) {
                                particlesRef.current.push({
                                    x: targetX - 5,
                                    y: targetY + 5,
                                    vx: -Math.random() * 2.2 - 0.8,
                                    vy: Math.random() * 1.8 + 0.4,
                                    size: Math.random() * 3 + 1.5,
                                    alpha: 1.0,
                                    color: Math.random() > 0.4 ? '#f59e0b' : '#ef4444'
                                });
                            }
                        }

                        particlesRef.current.forEach((p, idx) => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= 0.04;
                            if (p.alpha <= 0) {
                                particlesRef.current.splice(idx, 1);
                                return;
                            }
                            ctx.save();
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });

                        // Draw Fighter Jet
                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 6.5);

                            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
                            glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                            glow.addColorStop(0.3, 'rgba(251, 191, 36, 0.7)');
                            glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
                            ctx.fillStyle = glow;
                            ctx.beginPath();
                            ctx.arc(0, 0, 24, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.shadowColor = '#fbbf24';
                            ctx.shadowBlur = 14;
                            ctx.fillStyle = '#ffffff';

                            ctx.beginPath();
                            ctx.moveTo(13, 0);
                            ctx.quadraticCurveTo(5, -6, -7, -5);
                            ctx.lineTo(-10, -8);
                            ctx.lineTo(-8, -2);
                            ctx.lineTo(-10, 2);
                            ctx.lineTo(-8, 8);
                            ctx.lineTo(-7, 5);
                            ctx.quadraticCurveTo(5, 6, 13, 0);
                            ctx.closePath();
                            ctx.fill();

                            ctx.restore();
                        }
                    }

                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return (
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />
            );
        };

                                    </div>

                                    <div className="grid grid-cols-4 gap-1.5">
                                        <button onClick={() => { setBetValue('small'); setIsBetSheetOpen(true); }} className="bg-sky-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow-md">Small 2X</button>
                                        <button onClick={() => { setBetValue('big'); setIsBetSheetOpen(true); }} className="bg-amber-500 text-slate-950 py-3 rounded-2xl font-black text-xs uppercase shadow-neon-gold">Big 2X</button>
                                        <button onClick={() => { setBetValue('even'); setIsBetSheetOpen(true); }} className="bg-emerald-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow-md">Even 2X</button>
                                        <button onClick={() => { setBetValue('odd'); setIsBetSheetOpen(true); }} className="bg-rose-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow-md">Odd 2X</button>
                                    </div>

                                    <div className="glass-panel rounded-3xl border border-slate-800 overflow-hidden shadow-luxury">
                                        <div className="p-2.5 bg-slate-900 text-xs font-bold font-mono text-amber-400 border-b border-slate-800">K3 Result History</div>
                                        <table className="w-full text-[10px] font-mono text-left">
                                            <tbody>
                                                {drawHistoryK330s.slice(0, 10).map((item, idx) => (
                                                    <tr key={idx} className="border-b border-slate-800/60 hover:bg-slate-800/40">
                                                        <td className="py-2 pl-3 text-slate-400">{item.period}</td>
                                                        <td className="py-2 text-center text-yellow-300 font-bold">[{item.dice.join(', ')}]</td>
                                                        <td className="py-2 text-center text-slate-300">Sum: {item.sum}</td>
                                                        <td className="py-2 pr-3 text-right text-amber-400 font-bold">{item.size} / {item.parity}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================================= */}
                        {/* VIEW 6: bKash EXCLUSIVE DEPOSIT VIEW (With New bKash Logo)                */}
                        {/* ========================================================================= */}
                        {view === 'deposit' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800">
                                    <BackButton onClick={() => setView('home')} label="Back" />
                                    <h1 className="text-sm font-bold text-slate-100">bKash Fast Deposit</h1>
                                    <span className="w-10"></span>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3 min-h-0 pb-16">
                                    
                                    {/* 🌟 3. bKash Official Gateway Banner with New Logo */}
                                    <div className="p-4 rounded-3xl bg-[#0b101c] border-2 border-pink-500/80 flex flex-col items-center justify-center space-y-2 text-center shadow-neon-pink">
                                        <BkashLogo className="w-16 h-16 rounded-2xl" />
                                        <span className="text-xs font-black text-pink-400 uppercase tracking-widest block">Official bKash Gateway</span>
                                    </div>

                                    {/* Gateway Receiver Number Box */}
                                    <div className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2">
                                        <span className="text-[9.5px] text-slate-400 font-bold uppercase tracking-wider block">
                                            Official bKash Agent Receiver:
                                        </span>
                                        <div className="p-3 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-between">
                                            <div>
                                                <span className="text-xs sm:text-sm font-black text-amber-300 font-mono select-all">
                                                    01860909272
                                                </span>
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    navigator.clipboard.writeText('01860909272');
                                                    showToast('bKash Agent Number copied!', 'success');
                                                }} 
                                                className="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 rounded-xl text-[10px] font-black shadow-neon-gold"
                                            >
                                                Copy
                                            </button>
                                        </div>
                                    </div>

                                    <form onSubmit={processDeposit} className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2.5">
                                        <div className="grid grid-cols-4 gap-1.5 font-mono">
                                            {['200', '500', '1000', '5000'].map(val => (
                                                <button type="button" key={val} onClick={() => setDepositAmount(val)} className={`py-1.5 rounded-xl border text-xs font-bold ${depositAmount === val ? 'bg-pink-600 text-white border-pink-400 font-black' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>৳{val}</button>
                                            ))}
                                        </div>
                                        <input type="number" placeholder="Deposit Amount (Min ৳100)" value={depositAmount} onChange={e => setDepositAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <input type="tel" placeholder="Sender bKash Number" value={senderNumber} onChange={e => setSenderNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white"/>
                                        <input type="text" placeholder="Transaction ID / TxID" value={transactionId} onChange={e => setTransactionId(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono uppercase text-white"/>
                                        <button type="submit" className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black text-xs uppercase shadow-neon-pink">
                                            Submit bKash Recharge (৳{depositAmount})
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* ========================================================================= */}
                        {/* VIEW 7: WITHDRAW VIEW                                                     */}
                        {/* ========================================================================= */}
                        {view === 'withdraw' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800">
                                    <BackButton onClick={() => setView('home')} label="Back" />
                                    <h1 className="text-sm font-bold text-slate-100">bKash Withdrawal</h1>
                                    <span className="w-10"></span>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5 min-h-0 pb-16">
                                    <div className="glass-panel p-4 rounded-3xl border border-slate-800 space-y-2">
                                        <span className="text-xs text-slate-400 font-bold uppercase">Withdrawable Balance:</span>
                                        <span className="text-2xl font-black text-emerald-400 font-mono block">৳{formatMoney(balance)}</span>
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); showToast('Withdraw ticket submitted!', 'success'); }} className="space-y-3">
                                        <input type="number" placeholder="Enter Amount" value={withdrawAmount} onChange={e => setWithdrawAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <input type="tel" placeholder="Receiver bKash Number" value={withdrawNumber} onChange={e => setWithdrawNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green">
                                            Confirm Cashout
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* CONFIRM LOTTERY BET MODAL */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-black/80 z-[90] flex flex-col justify-end font-sans backdrop-blur-sm">
                            <div className="bg-[#0f172a] rounded-t-[2rem] p-5 space-y-3.5 border-t border-slate-800 text-white safe-bottom">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Selection: <strong className="text-amber-400 uppercase">{betValue}</strong></span>
                                    <button onClick={() => setIsBetSheetOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                    {[10, 50, 100, 500].map(amt => (
                                        <button key={amt} onClick={() => setSelectedUnit(amt)} className={`py-2 rounded-xl text-xs font-bold border ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400' : 'bg-slate-900 border-slate-800'}`}>৳{amt}</button>
                                    ))}
                                </div>
                                <button onClick={() => { setBalance(prev => prev - selectedUnit); showToast(`Bet of ৳${selectedUnit} placed!`, 'success'); setIsBetSheetOpen(false); }} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green">
                                    Confirm Bet (৳{selectedUnit})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* LUXURY GOLDEN POPUP RESULT */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1000] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md animate-fade-in">
                            <div className="relative w-full max-w-sm glass-panel-glow border-2 border-amber-400/80 rounded-3xl p-6 text-center shadow-2xl overflow-hidden">
                                <div className="text-5xl mb-2">🏆</div>
                                <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 font-mono">
                                    BIG WIN CASHOUT!
                                </h2>
                                <div className="p-3 bg-black/60 rounded-2xl border border-amber-400/40 my-3">
                                    <span className="text-3xl font-black text-yellow-300 font-mono block">
                                        ৳{formatMoney(popupAmount)}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => setShowResultPopup(false)} 
                                    className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold"
                                >
                                    Collect Winnings
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
