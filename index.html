            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;

        const formatClockTime = (timestampMs) => {
            const d = new Date(timestampMs);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        };

        const generate100PlusHistory = (prefix, durationSec, count = 115) => {
            const list = [];
            const now = Date.now();
            for (let i = 0; i < count; i++) {
                const roundTime = now - (i * durationSec * 1000);
                const dig = Math.floor(Math.random() * 10);
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const d3 = Math.floor(Math.random() * 6) + 1;
                const sum = d1 + d2 + d3;
                list.push({
                    period: `20260903${prefix}${String(90000 - i)}`,
                    time: formatClockTime(roundTime),
                    number: dig,
                    size: dig >= 5 ? 'Big' : 'Small',
                    color: dig === 0 ? 'violet-red' : (dig === 5 ? 'violet-green' : ([1,3,7,9].includes(dig) ? 'green' : 'red')),
                    dice: [d1, d2, d3],
                    sum: sum,
                    k3Size: sum >= 11 ? 'Big' : 'Small'

            }

        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 8.5));
                    const startX = 20;
                    const startY = height - 20;
                    const cpX = width * 0.45;
                    const cpY = height - 20;
                    const targetX = startX + (width - 70) * Math.min(1, progress * 1.1 + 0.1);
                    const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.05);

                    if (phase === 'flying' || phase === 'crashed') {
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.45)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        ctx.save();
                        ctx.strokeStyle = '#e51e38';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 8);
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(16, 0);
                            ctx.quadraticCurveTo(6, -7, -8, -6);
                            ctx.lineTo(-11, -9);
                            ctx.lineTo(-9, -2);
                            ctx.lineTo(-11, 2);
                            ctx.lineTo(-9, 9);
                            ctx.lineTo(-8, 6);
                            ctx.quadraticCurveTo(6, 7, 16, 0);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />;
        };

            const generateNewRoundBettors = () => {

                    });

            // AVIATOR ENGINE (Audio strictly in Aviator)
            useEffect(() => {
                let avInterval;

                    generateNewRoundBettors();
                    avInterval = setInterval(() => {
                        setAviatorCountdown(prev => {

                                let nextCrash;

                                        const r = Math.random() * 100;

                                    }
                                }
                                setAviatorCrashPoint(nextCrash);
                                return 8;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else if (aviatorPhase === 'flying') {
                    const start = Date.now();
                    avInterval = setInterval(() => {
                        const elapsedSec = (Date.now() - start) / 1000;
                        const cur = parseFloat((1.00 + (elapsedSec * 0.055) + Math.pow(elapsedSec * 0.022, 1.35)).toFixed(2));
                        setAviatorMult(cur);

                        setLiveBettors(prev => prev.map(b => {
                            if (!b.cashedOut && cur >= b.targetCashout) {
                                return { ...b, cashedOut: true };
                            }
                            return b;
                        }));

                        if (cur >= aviatorCrashPoint) {
                            clearInterval(avInterval);
                            setAviatorPhase('crashed');
                            playAviatorAudio('crash');
                            setAviatorHistory(prev => [{ mult: aviatorCrashPoint }, ...prev.slice(0, 15)]);

                                setAviatorPhase('waiting');

                        }
                    }, 60);
                }
                return () => clearInterval(avInterval);
            }, [aviatorPhase, aviatorCrashPoint, isAviatorBetPlaced, aviatorStake]);

            useEffect(() => {
                const interval = setInterval(() => {
                    const nowSec = Math.floor(Date.now() / 1000);
                    const newTimers = {
                        'wingo_30s': 30 - (nowSec % 30),
                        'wingo_1m': 60 - (nowSec % 60),
                        'wingo_2m': 120 - (nowSec % 120),
                        'trx_1m': 60 - (nowSec % 60),
                        'trx_3m': 180 - (nowSec % 180),
                        'k3_1m': 60 - (nowSec % 60),
                        'k3_3m': 180 - (nowSec % 180)
                    };
                    setTimers(newTimers);

                    Object.keys(newTimers).forEach(key => {
                        if (newTimers[key] === 1) {
                            handleIndependentGameSettlement(key);
                        }
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [wingoHistories, trxHistories, k3Histories, activeBets, balance]);

            const handleIndependentGameSettlement = (gameKey) => {
                const d = new Date();
                const timeStr = formatClockTime(d.getTime());
                const dig = Math.floor(Math.random() * 10);
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const d3 = Math.floor(Math.random() * 6) + 1;
                const sum = d1 + d2 + d3;
                const isBig = dig >= 5;
                const color = dig === 0 ? 'violet-red' : (dig === 5 ? 'violet-green' : ([1,3,7,9].includes(dig) ? 'green' : 'red'));

                const periodNumber = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}${gameKey.toUpperCase().slice(0,4)}${Date.now().toString().slice(-4)}`;

                const resultEntry = {
                    period: periodNumber,
                    time: timeStr,
                    number: dig,
                    size: isBig ? 'Big' : 'Small',
                    color: color,
                    dice: [d1, d2, d3],
                    sum: sum,
                    k3Size: sum >= 11 ? 'Big' : 'Small'
                };

                if (gameKey.startsWith('wingo_')) {
                    const mode = gameKey.replace('wingo_', '');
                    setWingoHistories(prev => ({
                        ...prev,
                        [mode]: [resultEntry, ...(prev[mode] || []).slice(0, 115)]
                    }));
                } else if (gameKey.startsWith('trx_')) {
                    const mode = gameKey.replace('trx_', '');
                    setTrxHistories(prev => ({
                        ...prev,
                        [mode]: [resultEntry, ...(prev[mode] || []).slice(0, 115)]
                    }));
                } else if (gameKey.startsWith('k3_')) {
                    const mode = gameKey.replace('k3_', '');
                    setK3Histories(prev => ({
                        ...prev,
                        [mode]: [resultEntry, ...(prev[mode] || []).slice(0, 115)]
                    }));
                }

                setActiveBets(prevBets => {
                    let totalWin = 0;
                    const remaining = [];

                    prevBets.forEach(bet => {
                        if (bet.gameKey === gameKey) {
                            let won = false;
                            if (gameKey.startsWith('wingo_') || gameKey.startsWith('trx_')) {
                                if (bet.selection === 'Green' && (color === 'green' || color === 'violet-green')) won = true;
                                if (bet.selection === 'Red' && (color === 'red' || color === 'violet-red')) won = true;
                                if (bet.selection === 'Violet' && (color === 'violet-red' || color === 'violet-green')) won = true;
                                if (bet.selection === 'Big' && isBig) won = true;
                                if (bet.selection === 'Small' && !isBig) won = true;
                                if (String(bet.selection) === String(dig)) won = true;
                            } else if (gameKey.startsWith('k3_')) {
                                if (bet.selection === 'Big' && sum >= 11) won = true;
                                if (bet.selection === 'Small' && sum < 11) won = true;
                                if (String(bet.selection) === String(sum)) won = true;
                            }

                            if (won) totalWin += bet.amount * bet.odds;
                        } else {
                            remaining.push(bet);
                        }
                    });

                    if (totalWin > 0) {
                        updateBalanceInFirebase(balance + totalWin);
                        triggerWinPopup(totalWin, gameKey.toUpperCase());
                    }
                    return remaining;
                });
            };

            const handleAviatorBet = () => {
                if (aviatorPhase !== 'waiting') return;
                if (balance < aviatorStake) return alert('পর্যাপ্ত ব্যালেন্স নেই!');

                const win = parseFloat((aviatorStake * aviatorMult).toFixed(2));

            const handleCashoutSubmit = (e) => {

                });

            const handleLogin = (e) => {

                const fullPhone = `+880${phone}`;

            const handleGoogleLogin = () => {
                try {
                    if (window.firebase && firebase.auth) {
                        const provider = new firebase.auth.GoogleAuthProvider();
                        provider.setCustomParameters({ prompt: 'select_account' });

                        firebase.auth().signInWithPopup(provider).then((result) => {
                            const gUser = result.user;
                            const gEmail = gUser.email || '';
                            const gName = gUser.displayName || 'Google Member';
                            const sanitizedKey = gEmail ? gEmail.replace(/[^a-zA-Z0-9]/g, '_') : ('g_' + gUser.uid.slice(0, 10));

                            const userRef = db.ref('users/' + sanitizedKey);
                            userRef.once('value').then(snap => {
                                if (snap.exists()) {
                                    localStorage.setItem('steven_win_phone', sanitizedKey);
                                    setSessionPhone(sanitizedKey);
                                } else {
                                    const randSuffix = Math.floor(100000 + Math.random() * 900000);

                        handleSimulatedGoogleLogin();

                }

            const handleSimulatedGoogleLogin = () => {

                            balance: 0.00,
                            exp: 380,
                            stxId: 'STX-' + randSuffix,
                            referralCode: '37276100176',
                            avatar: STEVEN_MAIN_LOGO,
                            vipLevel: 1,
                            banned: false,

                            localStorage.setItem('steven_win_phone', sanitizedKey);

                    }
                });

            const handleDepositTrxSubmit = (trxId) => {

                };

                ]).then(() => {

                    alert(`✅ ট্রানজেকশন ${trxId} সাবমিট হয়েছে! এডমিন ভেরিফাই করে ব্যালেন্স যোগ করে দেবে।`);
                });

                    setStepProgress(2);
                    setTimeout(() => {
                        setStepProgress(3);
                        setTimeout(() => {
                            setDepositStep('bkashVerify');
                        }, 1200);
                    }, 1100);
                }, 1000);
            };

            if (!isRobotVerified) {
                return (
                    <div className="h-full w-full bg-[#0b0f19] flex flex-col items-center justify-center p-5 select-none font-sans text-slate-100">
                        <div className="w-full max-w-sm glass-panel border border-emerald-500/40 rounded-3xl p-6 shadow-2xl text-center space-y-5">
                            <div className="w-16 h-16 mx-auto rounded-2xl bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-400 shadow-neon-green">
                                <Icons.shield className="w-9 h-9" />
                            </div>

                            <div className="space-y-1">
                                <h2 className="text-lg font-black tracking-wide text-white uppercase font-mono">Security Check</h2>
                                <p className="text-xs text-slate-400">Checking your connection before proceeding to STEVEN WIN.</p>
                            </div>

                                            <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider block font-mono">STEP 01</span>
                                            <h4 className="text-sm font-black text-slate-800">User</h4>
                                            <span className="text-xs text-slate-500">Verifying your order information</span>
                                        </div>
                                    </div>
                                    <Icons.check className="w-6 h-6 stroke-[3] text-[#00b074]" />
                                </div>

                                <div className="w-0.5 h-3 bg-[#00b074] ml-10"></div>

                                <div className="bg-[#e9fbf3] border border-[#a3e6c5] rounded-3xl p-4 flex items-center justify-between shadow-xs">
                                    <div className="flex items-center space-x-3.5">
                                        <div className="w-12 h-12 rounded-2xl bg-[#00b074] text-white flex items-center justify-center shadow-md">
                                            <Icons.receipt className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider block font-mono">STEP 02</span>
                                            <h4 className="text-sm font-black text-slate-800">Product Server</h4>
                                            <span className="text-xs text-slate-500">Sending your data securely</span>
                                        </div>
                                    </div>
                                    {stepProgress >= 2 ? (
                                        <Icons.check className="w-6 h-6 stroke-[3] text-[#00b074]" />
                                    ) : (
                                        <div className="w-5 h-5 border-2 border-[#00b074] border-t-transparent rounded-full animate-spin"></div>
                                    )}
                                </div>

                                <div className="w-0.5 h-3 bg-[#00b074] ml-10"></div>

                                <div className="bg-[#e9fbf3] border border-[#00b074] rounded-3xl p-4 flex items-center justify-between shadow-xs">
                                    <div className="flex items-center space-x-3.5">
                                        <div className="w-12 h-12 rounded-2xl bg-[#008f4c] text-white flex items-center justify-center shadow-md">
                                            <Icons.check className="w-6 h-6 stroke-[3]" />
                                        </div>
                                        <div>
                                            <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider block font-mono">STEP 03</span>
                                            <h4 className="text-sm font-black text-slate-800">Complete</h4>
                                            <span className="text-xs text-slate-500">Finalizing your order</span>
                                        </div>
                                    </div>
                                    <div className="w-5 h-5 border-2 border-[#00b074] border-t-transparent rounded-full animate-spin"></div>
                                </div>
                            </div>

                            <div className="pb-4 text-center">
                                <div className="inline-flex items-center space-x-1.5 text-xs text-[#00a86b] font-semibold">
                                    <span>🔒</span>
                                    <span>Secure processing • Please do not close this page</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BKASH VERIFY SCREEN */}
                    {depositStep === 'bkashVerify' && (
                        <div className="fixed inset-0 z-[2000] bg-[#d81b60] flex flex-col justify-between font-sans select-none overflow-hidden">
                            <div className="pt-4 px-4 flex justify-between items-center flex-shrink-0">
                                <button onClick={() => setDepositStep(null)} className="text-white/80 hover:text-white p-1">
                                    <Icons.x className="w-6 h-6" />
                                </button>
                                <span className="text-sm font-bold text-white/90 font-mono">bKash Payment</span>
                            </div>

                            <div className="flex-1 flex flex-col justify-between p-5 space-y-4 max-w-sm mx-auto w-full overflow-y-auto">
                                <div className="space-y-4 pt-1">
                                    <h2 className="text-center font-bold text-xl text-white tracking-wide">
                                        ট্রানজেকশন আইডি দিন
                                    </h2>

                                    <div className="relative pt-2">
                                        <label className="absolute -top-1 left-4 bg-white text-[#d81b60] px-2.5 py-0.5 rounded text-[12px] font-bold z-10 shadow-sm">
                                            ট্রান্সজেকশন আইডি লিখুন
                                        </label>
                                        <input 
                                            type="text" 
                                            id="trxInput"
                                            placeholder=""
                                            className="w-full bg-white text-slate-900 rounded-2xl py-3.5 px-4 font-mono font-bold text-base outline-none border-2 border-transparent focus:border-yellow-300 shadow-sm"
                                        />
                                    </div>

                                    <div className="bg-[#ba1251] rounded-2xl p-4 space-y-3 text-sm text-white font-medium shadow-md">
                                        <div className="flex items-start space-x-2">
                                            <span className="text-lg leading-none mt-0.5">•</span>
                                            <span><strong>*247#</strong> ডায়াল করে <strong>bKash</strong> মেনু বা অ্যাপে যান।</span>
                                        </div>

                                        <div className="border-t border-dashed border-white/25 pt-2"></div>

                                        <div className="space-y-2">
                                            <div className="flex items-start space-x-2">
                                                <span className="text-lg leading-none mt-0.5">•</span>
                                                <div className="leading-snug">
                                                    <span className="text-[#facc15] font-bold">"Send Money"</span>
                                                    <span> করুন। নম্বরঃ </span>
                                                    <span className="font-mono font-bold text-[#facc15] text-base">{OFFICIAL_BKASH_NUMBER}</span>
                                                </div>
                                            </div>

                                            <div className="pl-4">
                                                <button 
                                                    type="button" 
                                                    onClick={() => {
                                                        navigator.clipboard.writeText(OFFICIAL_BKASH_NUMBER);
                                                        setCopied(true);
                                                        setTimeout(() => setCopied(false), 2000);
                                                    }}
                                                    className="bg-[#d81b60] hover:bg-[#c2185b] border border-white/40 text-white text-[12px] font-bold px-3 py-1 rounded-lg shadow-sm active:scale-95 transition-all cursor-pointer"
                                                >
                                                    {copied ? 'Copied ✓' : 'Copy'}
                                                </button>
                                            </div>
                                        </div>

                                        <div className="border-t border-dashed border-white/25 pt-1"></div>

                                        <div className="flex items-start space-x-2">
                                            <span className="text-lg leading-none mt-0.5">•</span>
                                            <div>
                                                <span>পরিমাণঃ </span>
                                                <span className="font-mono font-bold text-[#facc15] text-base">৳{formatMoney(depositAmount)}</span>
                                                <span> দিয়ে পিন দিন।</span>
                                            </div>
                                        </div>

                                        <div className="border-t border-dashed border-white/25 pt-1"></div>

                                        <div className="flex items-start space-x-2">
                                            <span className="text-lg leading-none mt-0.5">•</span>
                                            <div>
                                                <span>সবশেষে উপরের বক্সে </span>
                                                <span className="text-[#facc15] font-bold font-mono">TrxID</span>
                                                <span> দিয়ে ভেরিফাই করুন।</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="pb-4 safe-bottom">
                                    <button 
                                        onClick={() => {
                                            const val = document.getElementById('trxInput')?.value;
                                            if (!val || val.trim().length < 8) return alert('সঠিক ট্রানজেকশন আইডি দিন!');
                                            handleDepositTrxSubmit(val.toUpperCase().trim());
                                        }}
                                        className="w-full py-4 bg-[#880e4f] hover:bg-[#720a41] text-white font-extrabold text-base uppercase tracking-widest rounded-2xl shadow-xl active:scale-98 transition-all font-mono cursor-pointer"
                                    >
                                        VERIFY
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* UNIFIED GAME BETTING MODAL */}
                    {betModal.show && (
                        <div className="fixed inset-0 z-[5000] bg-black/80 flex flex-col justify-end font-sans backdrop-blur-xs">
                            <div className="bg-[#0e1322] border-t border-amber-500/40 rounded-t-3xl p-5 space-y-4 shadow-2xl safe-bottom">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <div>
                                        <h3 className="text-sm font-black text-amber-300 font-mono uppercase">
                                            Place Bet: {betModal.selection}
                                        </h3>
                                        <span className="text-[10px] text-slate-400 font-mono">Odds: {betModal.odds}x</span>
                                    </div>
                                    <button onClick={() => setBetModal(p => ({ ...p, show: false }))} className="text-slate-400 p-1">
                                        <Icons.x className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    <span className="text-[10px] text-slate-400 uppercase font-bold block font-mono">Base Stake (BDT):</span>
                                    <div className="grid grid-cols-5 gap-2 font-mono">
                                        {[10, 50, 100, 500, 1000].map(s => (
                                            <button key={s} onClick={() => setBetModal(p => ({ ...p, baseStake: s }))} className={`py-2 rounded-xl font-bold text-xs ${betModal.baseStake === s ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>৳{s}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <span className="text-[10px] text-slate-400 uppercase font-bold block font-mono">Multiplier:</span>
                                    <div className="grid grid-cols-5 gap-2 font-mono">
                                        {[1, 5, 10, 20, 50].map(m => (
                                            <button key={m} onClick={() => setBetModal(p => ({ ...p, multiplier: m }))} className={`py-2 rounded-xl font-bold text-xs ${betModal.multiplier === m ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>X{m}</button>
                                        ))}
                                    </div>
                                </div>

                                <div className="pt-2 flex items-center justify-between font-mono">
                                    <span className="text-xs text-slate-400">Total Bet Amount:</span>
                                    <span className="text-lg font-black text-yellow-300">৳{betModal.baseStake * betModal.multiplier}</span>
                                </div>

                                <button onClick={handleConfirmBet} className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black text-xs uppercase tracking-widest rounded-2xl shadow-neon-gold cursor-pointer font-mono">
                                    Confirm & Place Bet
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
