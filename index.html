                const activeBets = (myBetsRef.current || []).filter(b => b.mode === mode && b.period === currentPeriod && b.status === 'pending');
                
                if (activeBets.length === 0) {

                const controlRoll = Math.random() * 100;

                if (controlRoll <= 99) {
                    const userWinStates = new Set();
                    activeBets.forEach(bet => {
                        const selection = typeof bet.selection === 'string' ? bet.selection.toLowerCase() : bet.selection;
                        
                        if (typeof selection === 'number') {
                            userWinStates.add(selection);
                        } else if (selection === 'big') {
                            [5, 6, 7, 8, 9].forEach(n => userWinStates.add(n));
                        } else if (selection === 'small') {
                            [0, 1, 2, 3, 4].forEach(n => userWinStates.add(n));
                        } else if (selection === 'green') {
                            [1, 3, 7, 9, 5].forEach(n => userWinStates.add(n));
                        } else if (selection === 'red') {
                            [2, 4, 6, 8, 0].forEach(n => userWinStates.add(n));
                        } else if (selection === 'violet') {
                            [0, 5].forEach(n => userWinStates.add(n));

                    const losingDigits = [];
                    for (let i = 0; i < 10; i++) {
                        if (!userWinStates.has(i)) {
                            losingDigits.push(i);
                        }
                    }

                    if (losingDigits.length > 0) {
                        return losingDigits[Math.floor(Math.random() * losingDigits.length)];
                    }
                }

                return Math.floor(Math.random() * 10);
            };

            const processPlacedBetsForMode = (mode, period, number, size, color) => {
                if (!currentUserRef.current) return;
                let winAmount = 0;
                let activeBetFound = false;

                const updatedBets = (myBetsRef.current || []).map(bet => {
                    if (bet.mode === mode && bet.period === period && bet.status === 'pending') {
                        activeBetFound = true;
                        let isWin = false;
                        let multiplierFactor = 0;

                        const selection = typeof bet.selection === 'string' ? bet.selection.toLowerCase() : bet.selection;

                        if (typeof selection === 'number') {
                            if (selection === number) { isWin = true; multiplierFactor = 9; }
                        } else if (selection === 'big' || selection === 'small') {
                            if (selection === size.toLowerCase()) { isWin = true; multiplierFactor = 2; }
                        } else if (['green', 'red', 'violet'].includes(selection)) {
                            if (color.includes(selection)) {
                                isWin = true;
                                multiplierFactor = selection === 'violet' ? 4.5 : 2;
                            }
                        }

                        if (isWin) {
                            const payout = bet.amount * multiplierFactor;
                            winAmount += payout;
                            return { ...bet, status: 'won', payout };
                        }
                        return { ...bet, status: 'lost', payout: 0 };
                    }
                    return bet;
                });

                if (activeBetFound) {
                    setMyBets(updatedBets);
                    const newBalance = balanceRef.current + winAmount;
                    setBalance(newBalance);
                    
                    const dbPath = 'users/' + getSanitizedPath(currentUserRef.current.phone);
                    db.ref(dbPath).update({
                        balance: newBalance,
                        bets: updatedBets
                    });

                    // Trigger outcome popup screen
                    setPopupAmount(winAmount);
                    setPopupType(winAmount > 0 ? 'win' : 'lose');
                    setShowResultPopup(true);
                }
            };

            const handleModeDraw = (mode) => {
                let currentPeriod = '';
                if (mode === '30sec') currentPeriod = period30sRef.current;
                else if (mode === '1min') currentPeriod = period1mRef.current;
                else currentPeriod = period2mRef.current;

                const drawNumber = determineOutcomeWithLossParameters(mode, currentPeriod);

                let drawColor = '';
                if (drawNumber === 0) drawColor = 'violet-red';
                else if (drawNumber === 5) drawColor = 'violet-green';
                else if ([1, 3, 7, 9].includes(drawNumber)) drawColor = 'green';
                else drawColor = 'red';

                const drawSize = drawNumber >= 5 ? 'Big' : 'Small';
                const newResult = { period: currentPeriod, number: drawNumber, size: drawSize, color: drawColor };

                if (mode === '30sec') {
                    setDrawHistory30s(prev => [newResult, ...prev]);
                    processPlacedBetsForMode(mode, currentPeriod, drawNumber, drawSize, drawColor);
                    setPeriod30s(prev => incrementPeriodString(prev));
                } else if (mode === '1min') {
                    setDrawHistory1m(prev => [newResult, ...prev]);
                    processPlacedBetsForMode(mode, currentPeriod, drawNumber, drawSize, drawColor);
                    setPeriod1m(prev => incrementPeriodString(prev));
                } else if (mode === '2min') {
                    setDrawHistory2m(prev => [newResult, ...prev]);
                    processPlacedBetsForMode(mode, currentPeriod, drawNumber, drawSize, drawColor);
                    setPeriod2m(prev => incrementPeriodString(prev));
                }
            };

            // Mutable draw ref to bypass hook closure limits
            const handleModeDrawRef = useRef(handleModeDraw);
            useEffect(() => {
                handleModeDrawRef.current = handleModeDraw;
            });

            // Clock Interval loop
            useEffect(() => {
                const clockInterval = setInterval(() => {
                    setTimer30s(prev => {
                        if (prev <= 1) {
                            handleModeDrawRef.current('30sec');
                            return 30;
                        }
                        return prev - 1;
                    });

                    setTimer1m(prev => {
                        if (prev <= 1) {
                            handleModeDrawRef.current('1min');
                            return 60;
                        }
                        return prev - 1;
                    });

                    setTimer2m(prev => {
                        if (prev <= 1) {
                            handleModeDrawRef.current('2min');
                            return 120;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(clockInterval);
            }, []);

            const generateReferralCode = () => {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = 'STX';
                for (let i = 0; i < 4; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return code;
            };

            const generateSTXId = () => {
                return 'STX-ID-' + Math.floor(1000 + Math.random() * 9000);
            };

            const handleSignupSubmit = (e) => {
                e.preventDefault();
                if (!phone || !username || !password || !confirmPassword) {
                    showToast('Please complete all form inputs', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showToast('Passwords do not match', 'error');
                    return;
                }
                
                setIsLoading(true);
                const fullPhone = `${selectedCountry.code}${phone}`;
                const sanitized = getSanitizedPath(fullPhone);

                db.ref('users/' + sanitized).once('value')
                    .then((snapshot) => {
                        if (snapshot.exists()) {
                            showToast('This phone number is already registered!', 'error');
                            setIsLoading(false);
                        } else {
                            const referralCode = generateReferralCode();
                            const stxId = generateSTXId();
                            const newUser = {
                                phone: fullPhone,
                                countryCode: selectedCountry.code,
                                username: username,
                                password: password,
                                balance: 0.00,
                                referralCode: referralCode,
                                stxId: stxId,
                                dailyClaimed: false, 
                                deposits: {},
                                withdrawals: {},
                                bets: {}
                            };

                            db.ref('users/' + sanitized).set(newUser)
                                .then(() => {
                                    db.ref('promo_codes/' + referralCode).set(sanitized);

                                    if (promoCode.trim()) {
                                        const promo = promoCode.trim().toUpperCase();
                                        db.ref('promo_codes/' + promo).once('value')
                                            .then((promoSnapshot) => {
                                                if (promoSnapshot.exists()) {
                                                    const referrerSanitizedPhone = promoSnapshot.val();
                                                    db.ref('users/' + referrerSanitizedPhone).once('value')
                                                        .then((refUserSnap) => {
                                                            if (refUserSnap.exists()) {
                                                                const referrerObj = refUserSnap.val();
                                                                const updatedRefBal = Number(referrerObj.balance || 0) + 10.00;
                                                                db.ref('users/' + referrerSanitizedPhone).update({
                                                                    balance: updatedRefBal
                                                                });
                                                            }
                                                        });
                                                }
                                            });
                                    }

                                    showToast('Account registered successfully! Log in.', 'success');
                                    setAuthTab('login');
                                    setPhone('');
                                    setUsername('');
                                    setPassword('');
                                    setConfirmPassword('');
                                    setPromoCode('');
                                })
                                .finally(() => setIsLoading(false));
                        }
                    })
                    .catch(() => {
                        showToast('Database sync failure', 'error');
                        setIsLoading(false);
                    });
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (!phone || !password) {
                    showToast('Please enter your credentials', 'error');
                    return;
                }

                setIsLoading(true);
                const fullPhone = `${selectedCountry.code}${phone}`;
                const sanitized = getSanitizedPath(fullPhone);

                db.ref('users/' + sanitized).once('value')
                    .then((snapshot) => {
                        if (snapshot.exists()) {
                            const userObj = snapshot.val();
                            if (userObj.password === password) {
                                if (userObj.banned) {
                                    showToast('Your account is banned. Contact support.', 'error');
                                    setIsLoading(false);
                                    return;
                                }
                                localStorage.setItem('steven_win_current_phone', fullPhone);
                                setSessionPhone(fullPhone); 
                                showToast(`Welcome, ${userObj.username}`, 'success');
                                setPhone('');
                                setPassword('');
                            } else {
                                showToast('Incorrect password entered', 'error');
                                setIsLoading(false);
                            }
                        } else {
                            showToast('No account associated with this number', 'error');
                            setIsLoading(false);
                        }
                    })
                    .catch(() => {
                        showToast('Database sync failure', 'error');
                        setIsLoading(false);
                    });
            };

            const processDeposit = (e) => {
                e.preventDefault();
                if (!currentUser) {
                    showToast('Please log in first', 'error');
                    return;
                }
                const amt = parseFloat(depositAmount);
                if (isNaN(amt) || amt < 100) {
                    showToast('Minimum deposit amount is ৳100', 'error');
                    return;
                }
                if (!senderNumber || senderNumber.length < 10) {
                    showToast('Enter valid sender bKash number', 'error');
                    return;
                }
                if (!transactionId || transactionId.length < 8) {
                    showToast('Provide valid Transaction ID', 'error');
                    return;
                }

                setIsDepositing(true);

                const depositId = Date.now().toString();
                const newDepositItem = {
                    id: depositId,
                    amount: amt,
                    sender: senderNumber,
                    txid: transactionId.toUpperCase(),
                    status: 'Pending', 
                    timestamp: new Date().toLocaleString(),
                    userPhone: currentUser.phone,
                    username: currentUser.username
                };

                const userPath = 'users/' + getSanitizedPath(currentUser.phone) + '/deposits/' + depositId;
                const globalPath = 'global_deposits/' + depositId;

                Promise.all([
                    db.ref(userPath).set(newDepositItem),
                    db.ref(globalPath).set(newDepositItem)
                ]).then(() => {
                    setIsDepositing(false);
                    showToast('Deposit request submitted! Status is Pending.', 'success');
                    setSenderNumber('');
                    setTransactionId('');
                    setDepositTab('history');
                }).catch(() => {
                    setIsDepositing(false);
                    showToast('Submission error. Try again.', 'error');
                });
            };

            const processWithdrawal = (e) => {
                e.preventDefault();
                if (!currentUser) {
                    showToast('Please log in first', 'error');
                    return;
                }
                const amt = parseFloat(withdrawAmount);
                if (isNaN(amt) || amt < 100) {
                    showToast('Minimum withdrawal amount is ৳100', 'error');
                    return;
                }
                if (amt > balance) {
                    showToast('Insufficient wallet balance!', 'error');
                    return;
                }
                if (!withdrawNumber || withdrawNumber.length < 10) {
                    showToast('Enter a valid bKash number!', 'error');
                    return;
                }

                setIsWithdrawing(true);

                const withdrawId = Date.now().toString();
                const newWithdrawalItem = {
                    id: withdrawId,
                    amount: amt,
                    receiver: withdrawNumber,
                    type: withdrawType,
                    status: 'Pending',
                    timestamp: new Date().toLocaleString(),
                    userPhone: currentUser.phone,
                    username: currentUser.username
                };

                const userPath = 'users/' + getSanitizedPath(currentUser.phone) + '/withdrawals/' + withdrawId;
                const globalPath = 'global_withdrawals/' + withdrawId;
                const userBalancePath = 'users/' + getSanitizedPath(currentUser.phone);

                const nextBalance = balance - amt;

                Promise.all([
                    db.ref(userPath).set(newWithdrawalItem),
                    db.ref(globalPath).set(newWithdrawalItem),
                    db.ref(userBalancePath).update({ balance: nextBalance })
                ]).then(() => {
                    setBalance(nextBalance);
                    setIsWithdrawing(false);
                    showToast('Withdrawal submitted! Balance adjusted.', 'success');
                    setWithdrawNumber('');
                    setWithdrawTab('history');
                }).catch(() => {
                    setIsWithdrawing(false);
                    showToast('Deduction loop sync error. Try again.', 'error');
                });
            };

            const handleDailyBonusClaim = () => {
                if (dailyClaimed) {
                    showToast('Already Claimed! Bonus is restricted to once per user.', 'error');
                    return;
                }
                if (!currentUser) {
                    showToast('Register or Login first to claim bonus!', 'error');
                    return;
                }

                const nextBalance = balance + 0.00; 
                setBalance(nextBalance);
                setDailyClaimed(true);

                const userPath = 'users/' + getSanitizedPath(currentUser.phone);
                db.ref(userPath).update({
                    balance: nextBalance,
                    dailyClaimed: true
                }).then(() => {
                    showToast('Claim Successful! ৳0.00 added to balance.', 'success');
                });
            };

            const confirmBetPlacement = () => {
                if (!currentUser) {
                    showToast('Please login first to place bets', 'error');
                    return;
                }
                const totalCost = selectedUnit * multiplier;
                if (totalCost <= 0) {
                    showToast('Please enter a valid bet amount!', 'error');
                    return;
                }
                if (totalCost > balance) {
                    showToast('Insufficient balance!', 'error');
                    setIsBetSheetOpen(false);
                    return;
                }

                let currentActivePeriod = '';
                if (activeGameTab === '30sec') currentActivePeriod = period30s;
                else if (activeGameTab === '1min') currentActivePeriod = period1m;
                else currentActivePeriod = period2m;

                const newBet = {
                    id: Date.now(),
                    period: currentActivePeriod,
                    mode: activeGameTab,
                    selection: betValue,
                    amount: totalCost,
                    status: 'pending',
                    timestamp: new Date().toLocaleTimeString()
                };

                const nextBalance = balance - totalCost;
                const nextBets = [newBet, ...(myBets || [])];

                setBalance(nextBalance);
                setMyBets(nextBets);

                const dbPath = 'users/' + getSanitizedPath(currentUser.phone);
                db.ref(dbPath).update({
                    balance: nextBalance,
                    bets: nextBets
                }).then(() => {
                    showToast(`Bet of ৳${totalCost} placed!`, 'success');
                    setIsBetSheetOpen(false);
                });
            };

            const getTimerForActiveTab = () => {
                if (activeGameTab === '30sec') return timer30s;
                if (activeGameTab === '1min') return timer1m;
                return timer2m;
            };

            const getPeriodForActiveTab = () => {
                if (activeGameTab === '30sec') return period30s;
                if (activeGameTab === '1min') return period1m;
                return period2m;
            };

            const getHistoryForActiveTab = () => {
                if (activeGameTab === '30sec') return drawHistory30s;
                if (activeGameTab === '1min') return drawHistory1m;
                return drawHistory2m;
            };

            const openBetConfirmation = (selection) => {
                if (balance <= 0) {
                    showToast('Deposit required to play! Please fund your wallet.', 'error');
                    return;
                }
                setBetValue(selection);
                setSelectedUnit(10);
                setMultiplier(1);
                setCustomBetInput(''); 
                setIsBetSheetOpen(true);
            };

            const handleLogout = () => {
                localStorage.removeItem('steven_win_current_phone');
                setSessionPhone('');
                setCurrentUser(null);
                setView('auth');
            };

            // SAFE-GUARDED LOAD SCREEN TO PREVENT WHITE PAGE AUTH GLITCH
            if (!isInitialized) {
                return (
                    <div className="flex-1 bg-slate-950 flex flex-col justify-center items-center text-white h-screen w-full md:max-w-md">
                        <div className="w-10 h-10 border-4 border-[#8a2be2] border-t-transparent rounded-full animate-spin"></div>
                        <span className="text-[11px] text-slate-400 font-bold mt-4 tracking-widest uppercase">Connecting to Gateway...</span>
                    </div>
                );
            }

            // Calculation values for withdrawal pending checks
            const hasPendingWithdraw = (withdrawHistory || []).some(w => w.status?.toLowerCase() === 'pending');
            const pendingWithdrawAmount = (withdrawHistory || [])
                .filter(w => w.status?.toLowerCase() === 'pending')
                .reduce((sum, w) => sum + Number(w.amount || 0), 0);

            return (
                <div className="flex-1 flex flex-col justify-between relative h-full bg-[#f5f6fa]">
                    
                    {/* Loading Modal overlay */}
                    {isLoading && (
                        <div className="absolute inset-0 bg-slate-900/70 z-[999] flex flex-col items-center justify-center">
                            <div className="w-10 h-10 border-4 border-[#8a2be2] border-t-transparent rounded-full animate-spin"></div>
                            <span className="text-white text-xs font-bold mt-3">Connecting to Secure Gateway...</span>
                        </div>
                    )}

                    {/* Toast Notification overlay */}
                    {toast.show && (
                        <div className="absolute top-4 left-1/2 -translate-x-1/2 z-[999] px-4 py-3 rounded-xl shadow-lg border text-xs font-semibold flex items-center space-x-2 bg-slate-900 text-white border-slate-700 animate-bounce">
                            <Icon name="check-circle" className="w-4 h-4 text-secondary" />
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* VIEWPORT CONTROLLER (Scrollable view above Bottom Navbar) */}
                    <div className="flex-1 flex flex-col justify-start overflow-y-auto pb-4">
                        
                        {/* VIEW: AUTHENTICATION */}
                        {view === 'auth' && (
                            <div className="flex-1 flex flex-col justify-center px-6 bg-slate-950 text-white py-8">
                                <div className="mb-6">
                                    <StevenXLogoVector />
                                </div>

                                <div className="flex bg-slate-900 p-1 rounded-xl mb-4 border border-slate-800">
                                    <button onClick={() => setAuthTab('login')} className={`flex-1 py-3 text-xs font-bold rounded-lg transition-all ${authTab === 'login' ? 'bg-[#8a2be2] text-white' : 'text-slate-400'}`}>Log In</button>
                                    <button onClick={() => setAuthTab('signup')} className={`flex-1 py-3 text-xs font-bold rounded-lg transition-all ${authTab === 'signup' ? 'bg-[#8a2be2] text-white' : 'text-slate-400'}`}>Sign Up</button>
                                </div>

                                <form onSubmit={authTab === 'login' ? handleLoginSubmit : handleSignupSubmit} className="space-y-3.5">
                                    {authTab === 'signup' && (
                                        <div>
                                            <label className="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Nickname</label>
                                            <div className="relative">
                                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="user" className="w-4 h-4" /></span>
                                                <input type="text" placeholder="Username" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs focus:ring-1 focus:ring-[#8a2be2] focus:outline-none text-white"/>
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Phone Number</label>
                                        <div className="flex space-x-2 relative">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowCountryDrop(!showCountryDrop)} 
                                                className="bg-slate-900 border border-slate-800 px-3 py-3 rounded-xl text-xs font-bold flex items-center space-x-1 hover:bg-slate-800 animate-fade-in"
                                            >
                                                <span>{selectedCountry.flag}</span>
                                                <span>{selectedCountry.code}</span>
                                                <Icon name="chevron-down" className="w-3.5 h-3.5" />
                                            </button>
                                            <input type="tel" placeholder="Phone Number" value={phone} onChange={e => setPhone(e.target.value)} className="flex-1 bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-xs focus:ring-1 focus:ring-[#8a2be2] focus:outline-none text-white"/>

                                            {showCountryDrop && (
                                                <div className="absolute left-0 bottom-full mb-2 w-56 max-h-48 overflow-y-auto bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-50 p-1">
                                                    {COUNTRIES.map((country, index) => (
                                                        <div 
                                                            key={index} 
                                                            onClick={() => { setSelectedCountry(country); setShowCountryDrop(false); }} 
                                                            className="flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 cursor-pointer text-xs text-white"
                                                        >
                                                            <span>{country.flag}</span>
                                                            <span className="font-semibold text-slate-200">{country.code}</span>
                                                            <span className="text-slate-400 text-[10px]">{country.name}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Password</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="lock" className="w-4 h-4" /></span>
                                            <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs focus:ring-1 focus:ring-[#8a2be2] focus:outline-none text-white"/>
                                        </div>
                                    </div>

                                    {authTab === 'signup' && (
                                        <>
                                            <div>
                                                <label className="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Confirm Password</label>
                                                <div className="relative">
                                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="shield-check" className="w-4 h-4" /></span>
                                                    <input type="password" placeholder="Confirm Password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs focus:ring-1 focus:ring-[#8a2be2] focus:outline-none text-white"/>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-slate-400 text-[10px] uppercase font-bold tracking-wider mb-1">Promo / Referral Code</label>
                                                <div className="relative">
                                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="gift" className="w-4 h-4" /></span>
                                                    <input type="text" placeholder="e.g. STXWXYZ" value={promoCode} onChange={e => setPromoCode(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs focus:ring-1 focus:ring-[#8a2be2] focus:outline-none text-white font-mono uppercase"/>
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-violet-600 to-[#8a2be2] hover:from-violet-500 text-white font-black rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-violet-900/30">
                                        {authTab === 'login' ? 'Confirm Login' : 'Register Account'}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* VIEW: HOME - HOME NAV */}
                        {view === 'home' && activeNav === 'home' && (
                            <div className="flex-1 flex flex-col justify-start">
                                <div className="bg-white px-4 py-3 flex justify-between items-center border-b border-gray-100 shadow-sm">
                                    <h1 className="text-xl font-black text-[#8a2be2] tracking-widest font-sans flex items-center">
                                        <div className="w-7 h-7 bg-slate-950 rounded-lg flex items-center justify-center border border-[#8a2be2] mr-2">
                                            <span className="text-base font-extrabold text-[#fccd11]">S</span>

                                        STEVENX
                                    </h1>
                                    <div className="flex space-x-3 text-slate-700 items-center">
                                        <button className="hover:text-[#8a2be2]"><Icon name="download" className="w-5 h-5" /></button>
                                        <button className="hover:text-[#8a2be2]"><Icon name="smile" className="w-5 h-5" /></button>

                                    <div onClick={() => setView('game')} className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-all">
                                        <div className="flex items-center space-x-3.5">
                                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-violet-600 to-[#8a2be2] flex items-center justify-center text-white font-black shadow-sm border border-violet-400 text-lg">SX</div>
                                            <div>
                                                <span className="font-extrabold text-slate-800 font-sans block text-sm">Wingo Game Mode</span>
                                                <span className="text-[10px] bg-violet-100 text-violet-700 px-2.5 py-0.5 rounded-full font-bold">30s / 1m / 2m Live</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center space-x-1.5">
                                            <span className="text-xs font-bold text-[#8a2be2]">Play Now</span>
                                            <div className="w-8 h-8 rounded-lg bg-secondary text-slate-900 flex items-center justify-center"><Icon name="chevron-right" className="w-5 h-5" /></div>
                                        </div>
                                    </div>
                                </div>

                                                                item.status === 'Success' ? 'bg-emerald-100 text-emerald-800' :
                                                                item.status === 'Rejected' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-850 animate-pulse border border-amber-300'

                                                        </div>
                                                        <div className="grid grid-cols-2 gap-1 text-[10px] text-slate-500 pt-1.5 border-t border-slate-50 font-mono">
                                                            <span>Receiver: {item.receiver}</span>
                                                            <span className="text-right">Mode: {item.type}</span>
                                                            <span className="col-span-2 text-slate-400 mt-1">{item.timestamp}</span>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* VIEW: GAME PLAY WINDOW */}
                        {view === 'game' && (
                            <div className="flex-1 flex flex-col bg-slate-50 justify-between">
                                <div className="bg-[#fccd11] px-4 py-3 flex items-center justify-between shadow-md">
                                    <button onClick={() => setView('home')} className="text-slate-900 hover:text-black">
                                        <Icon name="chevron-left" className="w-8 h-8" />
                                    </button>
                                    
                                    <div className="flex flex-col items-center">
                                        <div className="w-8 h-8 bg-slate-950 rounded-lg flex items-center justify-center border border-white shadow mb-0.5">
                                            <span className="text-sm font-black text-[#fccd11]">SX</span>
                                        </div>
                                        <span className="text-xs font-black text-slate-950 tracking-wider">STEVEN WIN</span>
                                    </div>

                                    <div className="flex space-x-3 text-slate-900">
                                        <a href="https://t.me/Kaisarvai007" target="_blank" rel="noopener noreferrer" className="hover:text-black"><Icon name="headphones" className="w-5 h-5" /></a>
                                        <button onClick={() => window.location.reload()}><Icon name="refresh-cw" className="w-5 h-5" /></button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto px-4 py-3 space-y-4 pb-16">
                                    
                                    <div className="grid grid-cols-3 gap-2 bg-slate-200/60 p-1 rounded-xl">
                                        {[
                                            { id: '30sec', desc: 'Wingo 30s' },
                                            { id: '1min', desc: 'Wingo 1 Min' },
                                            { id: '2min', desc: 'Wingo 2 Min' }
                                        ].map(tab => (
                                            <button 
                                                key={tab.id}
                                                onClick={() => { setActiveGameTab(tab.id); setGameSubTab('history'); }}
                                                className={`py-2 text-[11px] font-extrabold rounded-lg transition-all ${
                                                    activeGameTab === tab.id ? 'bg-secondary text-slate-950 shadow' : 'text-slate-500 hover:text-slate-800'
                                                }`}
                                            >
                                                {tab.desc}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-gradient-to-r from-violet-700 to-indigo-950 text-white rounded-2xl p-4 shadow-sm flex justify-between items-center border border-indigo-900/40">
                                        <div>
                                            <span className="text-[9px] text-slate-300 uppercase tracking-wider block">SX Wallet Balance</span>
                                            <span className="text-xl font-black text-secondary">৳{Number(balance || 0).toFixed(2)}</span>
                                        </div>
                                        <button onClick={() => { setView('deposit'); setDepositTab('new'); }} className="bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">Deposit Funds</button>
                                    </div>

                                    <div className="bg-gradient-to-r from-amber-400 to-[#fccd11] text-slate-950 p-4 rounded-2xl border border-amber-300">
                                        <div className="flex justify-between items-center pb-2.5 border-b border-amber-500/20">
                                            <span className="bg-amber-500/20 border border-amber-500/30 px-3 py-1 rounded-full text-[10px] font-bold">Wingo ruleset active</span>
                                            <span className="text-xs font-bold uppercase tracking-wide">Live Counter</span>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 pt-3 items-center">
                                            <div>
                                                <div className="flex space-x-1 mb-2">
                                                    {getHistoryForActiveTab().slice(0, 5).map((draw, idx) => (
                                                        <div key={idx} className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold text-white bg-slate-900">
                                                            {draw.number}
                                                        </div>
                                                    ))}
                                                </div>
                                                <span className="text-[9px] block text-slate-700">Period ID:</span>
                                                <span className="text-xs font-bold font-mono text-slate-950">{getPeriodForActiveTab()}</span>
                                            </div>

                                            <div className="text-right">
                                                <span className="text-[9px] font-bold block text-slate-700">Time remaining</span>
                                                <div className="flex justify-end space-x-1 mt-1 font-mono">
                                                    {formatTimeToSplit(getTimerForActiveTab()).map((char, index) => (
                                                        <span key={index} className={`px-1.5 text-sm font-black rounded ${char === ':' ? 'text-slate-950 bg-transparent px-0' : 'bg-slate-950 text-yellow-400'}`}>
                                                            {char}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={() => openBetConfirmation('green')} className="bg-gameGreen text-white py-3 rounded-xl font-bold text-xs">Green</button>
                                        <button onClick={() => openBetConfirmation('violet')} className="bg-gameViolet text-white py-3 rounded-xl font-bold text-xs">Violet</button>
                                        <button onClick={() => openBetConfirmation('red')} className="bg-gameRed text-white py-3 rounded-xl font-bold text-xs">Red</button>
                                    </div>

                                    {/* PREMIUM GLOSSY COLOURED BALLS SELECTION PANEL */}
                                    <div className="bg-white p-5 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100">
                                        <div className="grid grid-cols-5 gap-y-5 gap-x-3.5">
                                            {[
                                                { val: 0, style: 'bg-gradient-to-br from-gameRed via-rose-500 to-gameViolet text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(156,39,176,0.35)]' },
                                                { val: 1, style: 'bg-gradient-to-b from-emerald-400 to-gameGreen text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(24,182,96,0.35)]' },
                                                { val: 2, style: 'bg-gradient-to-b from-rose-400 to-gameRed text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(243,66,66,0.35)]' },
                                                { val: 3, style: 'bg-gradient-to-b from-emerald-400 to-gameGreen text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(24,182,96,0.35)]' },
                                                { val: 4, style: 'bg-gradient-to-b from-rose-400 to-gameRed text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(243,66,66,0.35)]' },
                                                { val: 5, style: 'bg-gradient-to-br from-gameGreen via-[#8bc34a] to-gameViolet text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(156,39,176,0.35)]' },
                                                { val: 6, style: 'bg-gradient-to-b from-rose-400 to-gameRed text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(243,66,66,0.35)]' },
                                                { val: 7, style: 'bg-gradient-to-b from-emerald-400 to-gameGreen text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(24,182,96,0.35)]' },
                                                { val: 8, style: 'bg-gradient-to-b from-rose-400 to-gameRed text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(243,66,66,0.35)]' },
                                                { val: 9, style: 'bg-gradient-to-b from-emerald-400 to-gameGreen text-white shadow-[inset_0_4px_10px_rgba(255,255,255,0.4),0_6px_15px_rgba(24,182,96,0.35)]' }
                                            ].map(ball => (
                                                <button 
                                                    key={ball.val} 
                                                    onClick={() => openBetConfirmation(ball.val)} 
                                                    className={`relative w-12 h-12 rounded-full flex items-center justify-center font-black text-sm transition-all transform active:scale-90 border border-white/20 overflow-hidden ${ball.style}`}
                                                >
                                                    <div className="absolute top-0.5 left-1/2 -translate-x-1/2 w-8 h-4 bg-white/25 rounded-full filter blur-[0.5px]"></div>
                                                    <span className="z-10 text-white font-extrabold text-base tracking-tighter shadow-sm">{ball.val}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => openBetConfirmation('big')} className="bg-[#e0b50f] py-2.5 rounded-xl font-black text-xs text-slate-950">BIG</button>
                                        <button onClick={() => openBetConfirmation('small')} className="bg-[#1e88e5] py-2.5 text-white rounded-xl font-black text-xs">SMALL</button>
                                    </div>

                                    <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                                        <div className="grid grid-cols-2 border-b border-slate-100 text-center text-[10px] font-bold">
                                            <button onClick={() => setGameSubTab('history')} className={`py-3 ${gameSubTab === 'history' ? 'border-b-2 border-primary text-primary' : 'text-slate-400'}`}>Game History</button>
                                            <button onClick={() => setGameSubTab('my_history')} className={`py-3 ${gameSubTab === 'my_history' ? 'border-b-2 border-primary text-primary' : 'text-slate-400'}`}>My Bets</button>
                                        </div>

                                        <div className="p-3">
                                            {gameSubTab === 'history' ? (
                                                <div className="space-y-1.5 text-[10px]">
                                                    {getHistoryForActiveTab().map((item, idx) => (
                                                        <div key={idx} className="flex justify-between items-center py-1.5 border-b border-slate-50 text-slate-600">
                                                            <span>{item.period}</span>
                                                            <span className="font-bold text-slate-900 bg-slate-100 w-5 h-5 flex items-center justify-center rounded-full">{item.number}</span>
                                                            <span className="font-bold">{item.size}</span>
                                                            <span className="capitalize text-primary">{item.color}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            ) : (
                                                <div className="space-y-2 text-[10px]">
                                                    {myBets.filter(b => b.mode === activeGameTab).length === 0 ? (
                                                        <div className="text-center py-8 text-slate-400">
                                                            <Icon name="info" className="w-6 h-6 mx-auto mb-1 opacity-50" />
                                                            <span>No bets logged in this mode yet.</span>
                                                        </div>
                                                    ) : (
                                                        myBets.filter(b => b.mode === activeGameTab).map(bet => (
                                                            <div key={bet.id} className="p-2.5 bg-white border border-slate-200/70 rounded-xl flex justify-between items-center">
                                                                <div>
                                                                    <span className="block text-slate-400 text-[9px] font-mono">Period: {bet.period}</span>
                                                                    <span className="font-bold text-slate-800">Prediction: <span className="uppercase text-primary font-black">{bet.selection}</span></span>
                                                                    <span className="block text-[9px] text-slate-400">{bet.timestamp}</span>
                                                                </div>
                                                                <div className="text-right">
                                                                    <span className="block font-black text-slate-700">৳{bet.amount}</span>
                                                                    <span className={`text-[9px] font-bold uppercase ${
                                                                        bet.status === 'won' ? 'text-emerald-600' : bet.status === 'lost' ? 'text-red-500' : 'text-amber-500'
                                                                    }`}>{bet.status}</span>
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* VIEW: BOTTOM NAVIGATION BAR (Anchored to App Window) */}
                    {view === 'home' && renderSharedNav()}

                    {/* DYNAMIC BET PLACEMENT POPUP SHEET */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-slate-900/60 z-[90] flex flex-col justify-end animate-fade-in">
                            <div className="bg-white rounded-t-[2rem] p-5 space-y-4 max-h-[90%] overflow-y-auto">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-bold text-slate-800">Confirm Bet Details</h3>
                                    <button onClick={() => setIsBetSheetOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <div className="p-3 bg-slate-50 rounded-xl flex justify-between text-xs">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block">Target Selection:</span>
                                        <span className="font-black text-primary uppercase text-sm">{betValue}</span>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-[10px] text-slate-400 block">Round Period:</span>
                                        <span className="font-bold text-slate-700">{getPeriodForActiveTab()}</span>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    <span className="text-[10px] font-bold text-slate-400 block">Select Preset Bet Amount:</span>
                                    <div className="flex flex-wrap gap-1.5">
                                        {[10, 50, 100, 500, 1000, 5000].map(val => (
                                            <button 
                                                key={val} 
                                                onClick={() => { setSelectedUnit(val); setCustomBetInput(''); }} 
                                                className={`px-3 py-1.5 rounded-lg border text-xs font-bold transition-all ${selectedUnit === val && !customBetInput ? 'bg-primary text-white border-transparent' : 'bg-white border-slate-200 text-slate-600'}`}
                                            >
                                                ৳{val}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Manual Balance Input box */}
                                    <div className="mt-2.5">
                                        <span className="text-[10px] font-bold text-slate-400 block mb-1">Or Enter Custom Amount (৳):</span>
                                        <input 
                                            type="number" 
                                            min="1"
                                            placeholder="e.g. 250" 
                                            value={customBetInput} 
                                            onChange={e => {
                                                const val = e.target.value;
                                                setCustomBetInput(val);
                                                if (val && parseFloat(val) > 0) {
                                                    setSelectedUnit(parseFloat(val));
                                                } else {
                                                    setSelectedUnit(0);
                                                }
                                            }} 
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-xs font-bold text-slate-800 focus:outline-none"
                                        />
                                    </div>

                                    {/* Multiplier Adjustment */}
                                    <div className="flex items-center justify-between pt-1">
                                        <span className="text-[10px] font-bold text-slate-400">Set Multiplier (Qty):</span>
                                        <div className="flex items-center space-x-2">
                                            <button onClick={() => setMultiplier(prev => Math.max(1, prev - 1))} className="w-7 h-7 rounded bg-slate-100 text-slate-600 font-bold">-</button>
                                            <span className="font-bold text-xs">{multiplier}</span>
                                            <button onClick={() => setMultiplier(prev => prev + 1)} className="w-7 h-7 rounded bg-slate-100 text-slate-600 font-bold">+</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block">Total cost:</span>
                                        <span className="text-xl font-black text-emerald-600">৳{(selectedUnit * multiplier).toFixed(2)}</span>
                                    </div>
                                    <button onClick={confirmBetPlacement} className="px-5 py-3 bg-gradient-to-r from-emerald-600 to-green-500 text-slate-950 font-black rounded-xl text-xs uppercase">Confirm Bet</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DYNAMIC RESULT POPUP (Matches reference visual style closely) */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/80 z-[1000] flex flex-col items-center justify-center p-6 animate-fade-in">
                            <div className="relative w-full max-w-sm bg-gradient-to-b from-[#192130] to-[#0c1017] border border-slate-800 rounded-3xl p-6 text-center shadow-2xl overflow-hidden">
                                
                                {/* Confetti gold aesthetics */}
                                <div className="absolute top-0 inset-x-0 h-40 pointer-events-none opacity-40 bg-[radial-gradient(ellipse_at_top,rgba(252,205,17,0.3),transparent_60%)]"></div>
                                
                                {popupType === 'win' ? (
                                    <>
                                        {/* Crown Graphic */}
                                        <div className="text-amber-400 flex justify-center mb-2 animate-bounce">
                                            <svg className="w-14 h-14 drop-shadow-[0_0_10px_rgba(252,205,17,0.6)]" fill="currentColor" viewBox="0 0 24 24">
                                                <path d="M12 2l3 6 6-1-4 5 3 6-8-3-8 3 3-6-4-5 6 1z"/>
                                            </svg>
                                        </div>
                                        <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 tracking-wider">YOU WON!</h2>
                                        <p className="text-[11px] text-slate-300 mt-1">Congratulations! Your prediction was correct.</p>
                                        
                                        {/* Premium Gold border win value container */}
                                        <div className="mt-6 p-5 bg-gradient-to-b from-[#141c2b] to-[#0c1017] rounded-2xl border border-amber-400/80 shadow-[0_0_20px_rgba(252,205,17,0.15)]">
                                            <span className="text-[9px] uppercase font-bold tracking-widest text-slate-400 block">Win Amount</span>
                                            <span className="text-3xl font-black text-[#fccd11] tracking-tight block mt-1">৳{Number(popupAmount).toFixed(2)}</span>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        {/* Loss Outcome Header */}
                                        <div className="text-rose-500 flex justify-center mb-3">
                                            <svg className="w-12 h-12" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                                <circle cx="12" cy="12" r="10" />
                                                <path d="M16 16s-1.5-2-4-2-4 2-4 2" />
                                                <line x1="9" y1="9" x2="9.01" y2="9" />
                                                <line x1="15" y1="9" x2="15.01" y2="9" />
                                            </svg>
                                        </div>
                                        <h2 className="text-2xl font-extrabold text-rose-500 tracking-wider">TRY AGAIN!</h2>
                                        <p className="text-[11px] text-slate-300 mt-1">Prediction missed. Better luck next round!</p>
                                        
                                        <div className="mt-6 p-5 bg-[#141b26] rounded-2xl border border-slate-800">
                                            <span className="text-[9px] uppercase font-bold tracking-widest text-slate-400 block">Win Amount</span>
                                            <span className="text-2xl font-bold text-slate-400 tracking-tight block mt-1">৳0.00</span>
                                        </div>
                                    </>
                                )}
                                <button 
                                    onClick={() => setShowResultPopup(false)} 
                                    className="mt-6 w-full py-3 bg-gradient-to-r from-yellow-400 to-[#fccd11] hover:to-yellow-300 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider shadow-md transition-all active:scale-95"
                                >
                                    Close Window
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );

            // Spacing Configured for bottom Sticky Tab Layout
            function renderSharedNav() {
                return (
                    <div className="bg-white border-t border-gray-200 py-3 px-6 flex justify-between items-center relative z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
                        <button onClick={() => { setView('home'); setActiveNav('home'); }} className={`flex flex-col items-center space-y-1 ${activeNav === 'home' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="home" className="w-6 h-6" />
                            <span className="text-[10px] font-bold">Home</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('activity'); }} className={`flex flex-col items-center space-y-1 ${activeNav === 'activity' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="gift" className="w-6 h-6" />
                            <span className="text-[10px] font-bold">Activity</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('promotion'); }} className={`flex flex-col items-center space-y-1 ${activeNav === 'promotion' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="percent" className="w-6 h-6" />
                            <span className="text-[10px] font-bold">Promo</span>
                        </button>
                        <button onClick={() => { setView('home'); setActiveNav('account'); }} className={`flex flex-col items-center space-y-1 relative ${activeNav === 'account' ? 'text-[#8a2be2]' : 'text-slate-400'}`}>
                            <Icon name="user" className="w-6 h-6" />
                            {hasPendingWithdraw && <span className="absolute top-0 right-0.5 w-2 h-2 bg-amber-500 rounded-full animate-ping"></span>}
                            <span className="text-[10px] font-bold">Account</span>
                        </button>
                    </div>
                );
            }
        }

        function formatTimeToSplit(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            const mString = String(mins).padStart(2, '0');
            const sString = String(secs).padStart(2, '0');
            return [mString[0], mString[1], ':', sString[0], sString[1]];
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
