                const digit = Math.floor(Math.random() * 10);
                const size = digit >= 5 ? 'Big' : 'Small';
                const color = digit === 0 ? 'violet-red' : (digit === 5 ? 'violet-green' : ([1,3,7,9].includes(digit) ? 'green' : 'red'));

        // 🌟 AVIATOR FLIGHT CANVAS TRAJECTORY & ROCKET ENGINE
        // =========================================================================
        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    // 1. Grid Background
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 1;
                    const step = 32;
                    for (let x = step; x < width; x += step) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = step; y < height; y += step) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                    ctx.restore();

                    if (phase === 'flying' || phase === 'crashed') {
                        const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 6.0));
                        const startX = 20;
                        const startY = height - 20;
                        const cpX = width * 0.45;
                        const cpY = height - 20;
                        const targetX = startX + (width - 60) * Math.min(1, progress * 1.15 + 0.1);
                        const targetY = startY - (height - 50) * Math.min(0.92, Math.pow(progress, 0.85) + 0.08);

                        // Fill Under Curve
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.25)');
                        fillGrad.addColorStop(0.7, 'rgba(229, 30, 56, 0.05)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        // Draw Curve
                        ctx.save();
                        ctx.shadowColor = '#e51e38';
                        ctx.shadowBlur = 14;
                        ctx.strokeStyle = phase === 'crashed' ? '#991b1b' : '#e51e38';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        // Sparks Particles
                        if (phase === 'flying') {
                            if (Math.random() < 0.7) {
                                particlesRef.current.push({
                                    x: targetX - 4,
                                    y: targetY + 4,
                                    vx: -Math.random() * 2.5 - 1.0,
                                    vy: Math.random() * 2.0 + 0.5,
                                    size: Math.random() * 3 + 1,
                                    alpha: 1.0,
                                    color: Math.random() > 0.4 ? '#fbbf24' : '#e51e38'
                                });
                            }
                        }

                        particlesRef.current.forEach((p, idx) => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= 0.04;
                            if (p.alpha <= 0) {
                                particlesRef.current.splice(idx, 1);
                                return;
                            }
                            ctx.save();
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });

                        // Draw Red Plane
                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 6);
                            ctx.font = '24px sans-serif';
                            ctx.fillText('✈️', -12, 8);
                            ctx.restore();
                        }
                    }

                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return (
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />
            );
        };

                                </div>

                                <div className="flex-1 px-3.5 py-3 space-y-3 overflow-y-auto pb-16 min-h-0">
                                    <div className="glass-panel-glow rounded-3xl p-4 border border-amber-500/40 shadow-luxury flex flex-col items-center justify-center space-y-2">
                                        <span className="text-[9.5px] uppercase font-black text-amber-300 font-mono">Last Round Result</span>
                                        <div className="flex space-x-3 justify-center items-center py-1">
                                            <DiceFace value={drawHistoryK3[0]?.dice[0] || 1} />
                                            <DiceFace value={drawHistoryK3[0]?.dice[1] || 4} />
                                            <DiceFace value={drawHistoryK3[0]?.dice[2] || 6} />
                                        </div>
                                        <div className="flex space-x-3 text-xs font-mono font-black text-yellow-300">
                                            <span>Sum: {drawHistoryK3[0]?.sum || 11}</span>
                                            <span>•</span>
                                            <span>{drawHistoryK3[0]?.size || 'Big'}</span>
                                            <span>•</span>
                                            <span>{drawHistoryK3[0]?.parity || 'Odd'}</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-1.5">
                                        <button onClick={() => { setBetValue('small'); setIsBetSheetOpen(true); }} className="bg-sky-600 text-white py-3 rounded-2xl font-black text-xs uppercase">Small 2X</button>
                                        <button onClick={() => { setBetValue('big'); setIsBetSheetOpen(true); }} className="bg-amber-500 text-slate-950 py-3 rounded-2xl font-black text-xs uppercase">Big 2X</button>
                                        <button onClick={() => { setBetValue('even'); setIsBetSheetOpen(true); }} className="bg-emerald-600 text-white py-3 rounded-2xl font-black text-xs uppercase">Even 2X</button>
                                        <button onClick={() => { setBetValue('odd'); setIsBetSheetOpen(true); }} className="bg-rose-600 text-white py-3 rounded-2xl font-black text-xs uppercase">Odd 2X</button>
                                    </div>

                                    <div className="glass-panel rounded-3xl border border-slate-800 overflow-hidden">
                                        <div className="p-2.5 bg-slate-900 text-xs font-bold font-mono text-amber-400 border-b border-slate-800">K3 Result History (Visual Dice)</div>
                                        <table className="w-full text-[10px] font-mono text-left">
                                            <tbody>
                                                {drawHistoryK3.slice(0, 8).map((item, idx) => (
                                                    <tr key={idx} className="border-b border-slate-800/60">
                                                        <td className="py-2 pl-3 text-slate-400">{item.period}</td>
                                                        <td className="py-2 text-center text-yellow-300 font-bold">[{item.dice.join(', ')}]</td>
                                                        <td className="py-2 text-center text-slate-300">Sum: {item.sum}</td>
                                                        <td className="py-2 pr-3 text-right text-amber-400 font-bold">{item.size} / {item.parity}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================================= */}
                        {/* VIEW 6: DEPOSIT VIEW                                                      */}
                        {/* ========================================================================= */}
                        {view === 'deposit' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800">
                                    <BackButton onClick={() => setView('home')} label="Back" />
                                    <h1 className="text-sm font-bold text-slate-100">bKash Fast Deposit</h1>
                                    <span className="w-10"></span>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3 min-h-0 pb-16">
                                    <div className="p-3.5 rounded-3xl bg-[#0b101c] border-2 border-bkashPink flex flex-col items-center justify-center space-y-1.5 text-center">
                                        <BkashAppIcon />
                                        <span className="text-xs font-black text-slate-200 uppercase tracking-widest block">Official bKash Gateway</span>
                                    </div>

                                    <div className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2">
                                        <span className="text-[9.5px] text-slate-400 font-bold uppercase tracking-wider block">Official Agent Receiver:</span>
                                        <div className="p-3 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-between">
                                            <div>
                                                <span className="text-xs sm:text-sm font-black text-amber-300 font-mono select-all">01860909272</span>
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    navigator.clipboard.writeText('01860909272');
                                                    showToast('Agent number copied!', 'success');
                                                }} 
                                                className="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 rounded-xl text-[10px] font-black"
                                            >
                                                Copy
                                            </button>
                                        </div>
                                    </div>

                                    <form onSubmit={processDeposit} className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2.5">
                                        <input type="tel" placeholder="Sender bKash Number" value={senderNumber} onChange={e => setSenderNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white"/>
                                        <input type="text" placeholder="Transaction ID / TxID" value={transactionId} onChange={e => setTransactionId(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono uppercase text-white"/>
                                        <button type="submit" className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-[#e2136e] to-[#bc1055] text-white font-black text-xs uppercase shadow-neon-pink">
                                            Submit Recharge
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* ========================================================================= */}
                        {/* VIEW 7: WITHDRAW VIEW                                                     */}
                        {/* ========================================================================= */}
                        {view === 'withdraw' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800">
                                    <BackButton onClick={() => setView('home')} label="Back" />
                                    <h1 className="text-sm font-bold text-slate-100">bKash Withdrawal</h1>
                                    <span className="w-10"></span>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5 min-h-0 pb-16">
                                    <div className="glass-panel p-4 rounded-3xl border border-slate-800 space-y-2">
                                        <span className="text-xs text-slate-400 font-bold uppercase">Withdrawable Balance:</span>
                                        <span className="text-2xl font-black text-emerald-400 font-mono block">৳{formatMoney(balance)}</span>
                                    </div>

                                    <form onSubmit={processWithdrawal} className="space-y-3">
                                        <div>
                                            <label className="block text-slate-400 text-[10px] uppercase font-bold mb-1">Amount (Min ৳100)</label>
                                            <input type="number" placeholder="Enter Amount" value={withdrawAmount} onChange={e => setWithdrawAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 text-[10px] uppercase font-bold mb-1">Receiver bKash Number</label>
                                            <input type="tel" placeholder="017XXXXXXXX" value={withdrawNumber} onChange={e => setWithdrawNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        </div>
                                        <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green">
                                            Confirm Cashout
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* CONFIRM LOTTERY BET MODAL */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-black/80 z-[90] flex flex-col justify-end font-sans backdrop-blur-sm">
                            <div className="bg-[#0f172a] rounded-t-[2rem] p-5 space-y-3.5 border-t border-slate-800 text-white safe-bottom">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Selection: <strong className="text-amber-400 uppercase">{betValue}</strong></span>
                                    <button onClick={() => setIsBetSheetOpen(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                    {[10, 50, 100, 500].map(amt => (
                                        <button key={amt} onClick={() => setSelectedUnit(amt)} className={`py-2 rounded-xl text-xs font-bold border ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400' : 'bg-slate-900 border-slate-800'}`}>৳{amt}</button>
                                    ))}
                                </div>
                                <button onClick={confirmLotteryBet} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green">
                                    Confirm Bet (৳{selectedUnit * multiplier})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* POPUP RESULT */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1000] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border border-amber-500/60 rounded-3xl p-5 text-center shadow-2xl">
                                <div className="text-4xl mb-1.5">🎉</div>
                                <h2 className="text-2xl font-black text-amber-400 tracking-wider font-mono">YOU WON!</h2>
                                <span className="text-3xl font-black text-yellow-300 tracking-tight block mt-2 font-mono">৳{formatMoney(popupAmount)}</span>
                                <button onClick={() => setShowResultPopup(false)} className="mt-5 w-full py-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold">
                                    Continue
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
