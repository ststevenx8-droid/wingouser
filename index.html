                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                if (type === 'spin') {

                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'stop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);
            const particlesRef = useRef([]);
            const explosionRef = useRef([]);
            const lastCrashRef = useRef(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);

                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                    ctx.lineWidth = 1;
                    for (let x = 30; x < width; x += 30) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = 30; y < height; y += 30) {
                        ctx.beginPath();
                        ctx.setLineDash([2, 4]);
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                    ctx.restore();

                    const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 10.0));
                    const startX = 20;
                    const startY = height - 20;
                    const cpX = width * 0.45;
                    const cpY = height - 20;
                    const targetX = startX + (width - 70) * Math.min(1, progress * 1.15 + 0.08);
                    const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.05);

                    if (phase === 'crashed' && !lastCrashRef.current) {
                        lastCrashRef.current = true;
                        explosionRef.current = [];
                        for (let i = 0; i < 50; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 7 + 2;
                            explosionRef.current.push({
                                x: targetX,
                                y: targetY,
                                vx: Math.cos(angle) * speed,
                                vy: Math.sin(angle) * speed,
                                size: Math.random() * 4 + 2,
                                alpha: 1.0,
                                color: ['#e51e38', '#ff4d6d', '#fbbf24', '#ffffff'][Math.floor(Math.random() * 4)]
                            });
                        }
                    } else if (phase !== 'crashed') {
                        lastCrashRef.current = false;
                    }

                    if (phase === 'flying' || phase === 'crashed') {
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.35)');
                        fillGrad.addColorStop(0.6, 'rgba(229, 30, 56, 0.08)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        ctx.save();
                        ctx.shadowColor = '#e51e38';
                        ctx.shadowBlur = 18;
                        ctx.strokeStyle = '#e51e38';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        if (phase === 'flying') {
                            if (Math.random() < 0.8) {
                                particlesRef.current.push({
                                    x: targetX - 5,
                                    y: targetY + 5,
                                    vx: -Math.random() * 2.2 - 0.8,
                                    vy: Math.random() * 1.8 + 0.4,
                                    size: Math.random() * 3 + 1.5,
                                    alpha: 1.0,
                                    color: Math.random() > 0.4 ? '#e51e38' : '#ff2a44'
                                });
                            }
                        }

                        particlesRef.current.forEach((p, idx) => {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.alpha -= 0.04;
                            if (p.alpha <= 0) {
                                particlesRef.current.splice(idx, 1);
                                return;
                            }
                            ctx.save();
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = p.alpha;
                            ctx.shadowColor = '#e51e38';
                            ctx.shadowBlur = 6;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });

                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 6.5);

                            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
                            glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                            glow.addColorStop(0.3, 'rgba(229, 30, 56, 0.8)');
                            glow.addColorStop(0.7, 'rgba(229, 30, 56, 0.25)');
                            glow.addColorStop(1, 'rgba(229, 30, 56, 0.0)');
                            ctx.fillStyle = glow;
                            ctx.beginPath();
                            ctx.arc(0, 0, 26, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.shadowColor = '#e51e38';
                            ctx.shadowBlur = 14;
                            ctx.fillStyle = '#ffffff';

                            ctx.beginPath();
                            ctx.moveTo(14, 0);
                            ctx.quadraticCurveTo(5, -6, -7, -5);
                            ctx.lineTo(-10, -8);
                            ctx.lineTo(-8, -2);
                            ctx.lineTo(-10, 2);
                            ctx.lineTo(-8, 8);
                            ctx.lineTo(-7, 5);
                            ctx.quadraticCurveTo(5, 6, 14, 0);
                            ctx.closePath();
                            ctx.fill();

                            ctx.restore();
                        }
                    }

                    if (phase === 'crashed' && explosionRef.current.length > 0) {
                        explosionRef.current.forEach((ep, idx) => {

                            ep.y += ep.vy;
                            ep.vx *= 0.96;
                            ep.vy *= 0.96;
                            ep.alpha -= 0.025;
                            if (ep.alpha <= 0) {
                                explosionRef.current.splice(idx, 1);
                                return;
                            }
                            ctx.save();
                            ctx.globalAlpha = ep.alpha;
                            ctx.fillStyle = ep.color;
                            ctx.shadowColor = ep.color;
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.arc(ep.x, ep.y, ep.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        });
                    }

                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return (
                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />
            );
        };

                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800 flex-shrink-0">
                                    <BackButton onClick={() => setView('home')} label="Back" />
                                    <h1 className="text-sm font-bold text-slate-100">bKash Deposit</h1>
                                    <div className="flex space-x-1 font-mono text-xs">
                                        <button onClick={() => setDepositTab('new')} className={`px-2.5 py-1 rounded-xl font-bold ${depositTab === 'new' ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Recharge</button>
                                        <button onClick={() => setDepositTab('history')} className={`px-2.5 py-1 rounded-xl font-bold ${depositTab === 'history' ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Records</button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3 min-h-0 pb-16">
                                    {depositTab === 'new' ? (
                                        <>
                                            <div className="p-4 rounded-3xl bg-[#0b101c] border-2 border-pink-500/80 flex flex-col items-center justify-center space-y-2 text-center shadow-neon-pink">
                                                <BkashLogo className="w-16 h-16 rounded-2xl" />
                                                <span className="text-xs font-black text-pink-400 uppercase tracking-widest block">Official bKash Gateway</span>
                                            </div>

                                            <div className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2">
                                                <span className="text-[9.5px] text-slate-400 font-bold uppercase tracking-wider block">
                                                    Official bKash Agent Receiver Number:
                                                </span>
                                                <div className="p-3 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-between">
                                                    <span className="text-xs sm:text-sm font-black text-amber-300 font-mono select-all">
                                                        01860909272
                                                    </span>
                                                    <button 
                                                        onClick={() => {
                                                            navigator.clipboard.writeText('01860909272');
                                                            showToast('bKash Agent Number copied!', 'success');
                                                        }} 
                                                        className="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 rounded-xl text-[10px] font-black shadow-neon-gold cursor-pointer"
                                                    >
                                                        Copy
                                                    </button>
                                                </div>
                                            </div>

                                            <form onSubmit={submitBkashDeposit} className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2.5">
                                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                                    {['200', '500', '1000', '5000'].map(val => (
                                                        <button type="button" key={val} onClick={() => setDepositAmount(val)} className={`py-1.5 rounded-xl border text-xs font-bold ${depositAmount === val ? 'bg-pink-600 text-white border-pink-400 font-black' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>৳{val}</button>
                                                    ))}
                                                </div>
                                                <input type="number" placeholder="Deposit Amount (Min ৳100)" value={depositAmount} onChange={e => setDepositAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                                <input type="tel" placeholder="Sender bKash Number" value={senderNumber} onChange={e => setSenderNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white"/>
                                                <input type="text" placeholder="Transaction ID / TxID" value={transactionId} onChange={e => setTransactionId(e.target.value.toUpperCase())} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono uppercase text-white"/>
                                                
                                                <button type="submit" className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black text-xs uppercase shadow-neon-pink cursor-pointer">
                                                    Submit Deposit (৳{depositAmount})
                                                </button>
                                            </form>
                                        </>
                                    ) : (
                                        <div className="space-y-2">
                                            {depositHistory.map((item, idx) => (
                                                <div key={idx} className="p-3 bg-slate-900 rounded-2xl border border-slate-800 space-y-1 text-xs font-mono">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-black text-pink-400">৳{formatMoney(item.amount)}</span>
                                                        <span className={`px-2 py-0.5 rounded-full text-[9.5px] font-bold ${
                                                            item.status === 'Approved' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 
                                                            (item.status === 'Rejected' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse')
                                                        }`}>
                                                            {item.status}
                                                        </span>
                                                    </div>
                                                    <div className="text-[10px] text-slate-400 flex justify-between">
                                                        <span>TxID: {item.txid}</span>
                                                        <span>Sender: {item.sender}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 8. BKASH WITHDRAW */}
                        {view === 'withdraw' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0 font-sans">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800 flex-shrink-0">
                                    <BackButton onClick={() => setView('home')} label="Back" />
                                    <h1 className="text-sm font-bold text-slate-100">bKash Withdrawal</h1>
                                    <span className="w-10"></span>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5 min-h-0 pb-16">
                                    <div className="glass-panel p-4 rounded-3xl border border-slate-800 space-y-2">
                                        <span className="text-xs text-slate-400 font-bold uppercase">Withdrawable Balance:</span>
                                        <span className="text-2xl font-black text-emerald-400 font-mono block">৳{formatMoney(balance)}</span>
                                    </div>

                                    <form onSubmit={submitBkashWithdrawal} className="space-y-3">
                                        <input type="number" placeholder="Enter Amount (Min ৳300)" value={withdrawAmount} onChange={e => setWithdrawAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <input type="tel" placeholder="Receiver bKash Number" value={withdrawNumber} onChange={e => setWithdrawNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green cursor-pointer">
                                            Confirm Cashout
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* LUCKY WHEEL BONUS MODAL */}
                    {showLuckyWheel && (
                        <div className="absolute inset-0 bg-black/90 z-[1200] flex flex-col items-center justify-center p-4 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border-2 border-yellow-400 rounded-3xl p-5 text-white flex flex-col items-center space-y-4 shadow-2xl">
                                <span className="text-xs font-black text-yellow-300 uppercase font-mono tracking-widest bg-yellow-400/20 px-3 py-1 rounded-full border border-yellow-400/40 animate-pulse">
                                    🎡 LUCKY WHEEL BONUS!
                                </span>

                                <div className="relative w-56 h-56 flex items-center justify-center">
                                    {/* Pointer */}
                                    <div className="absolute top-0 z-30 -mt-2 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-yellow-400 filter drop-shadow-md" />

                                    {/* Wheel */}
                                    <div 
                                        style={{ transform: `rotate(${wheelAngle}deg)`, transition: isWheelSpinning ? 'transform 3.2s cubic-bezier(0.15, 0.9, 0.2, 1)' : 'none' }}
                                        className="w-full h-full rounded-full border-4 border-yellow-400 shadow-neon-gold bg-gradient-to-tr from-amber-600 via-yellow-500 to-amber-700 relative overflow-hidden flex items-center justify-center"
                                    >
                                        <div className="absolute inset-0 grid grid-cols-2 grid-rows-2">
                                            <div className="bg-red-700/80 border border-yellow-300/30 flex items-center justify-center text-xs font-black font-mono">10,000X</div>
                                            <div className="bg-emerald-700/80 border border-yellow-300/30 flex items-center justify-center text-xs font-black font-mono">500X</div>
                                            <div className="bg-purple-700/80 border border-yellow-300/30 flex items-center justify-center text-xs font-black font-mono">2,500X</div>
                                            <div className="bg-amber-700/80 border border-yellow-300/30 flex items-center justify-center text-xs font-black font-mono">1,000X</div>
                                        </div>
                                        <div className="w-14 h-14 rounded-full bg-slate-950 border-2 border-yellow-400 z-20 flex items-center justify-center font-mono font-black text-yellow-300 text-xs shadow-lg">
                                            JILI
                                        </div>
                                    </div>
                                </div>

                                <span className="text-[11px] font-mono font-bold text-amber-200 text-center">
                                    {isWheelSpinning ? 'SPINNING WHEEL OF FORTUNE...' : 'CONGRATULATIONS!'}
                                </span>
                            </div>
                        </div>
                    )}

                    {/* AVIATOR HISTORY MODAL */}
                    {showAviatorHistoryModal && (
                        <div className="absolute inset-0 bg-black/85 z-[1050] flex flex-col items-center justify-center p-4 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border border-red-500/50 rounded-3xl p-4 text-white space-y-3 shadow-2xl flex flex-col max-h-[85vh]">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2 flex-shrink-0">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-red-500 text-base">✈️</span>
                                        <h3 className="text-xs font-black text-red-400 font-mono uppercase tracking-wider">Aviator History (120+ Rounds)</h3>
                                    </div>
                                    <button onClick={() => setShowAviatorHistoryModal(false)} className="text-slate-400 hover:text-white">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-0">
                                    <div className="grid grid-cols-3 gap-1.5 text-center font-mono">
                                        {aviatorHistory100.map((item, idx) => (
                                            <div 
                                                key={idx} 
                                                className={`p-2 rounded-xl border flex flex-col items-center justify-center ${
                                                    item.mult >= 10.0 ? 'bg-amber-500/15 border-amber-500/40 text-yellow-300' :
                                                    item.mult >= 2.0 ? 'bg-purple-600/15 border-purple-500/40 text-purple-300' :
                                                    'bg-blue-600/15 border-blue-500/40 text-blue-300'
                                                }`}
                                            >
                                                <span className="text-xs font-black">{Number(item.mult).toFixed(2)}x</span>
                                                <span className="text-[8.5px] opacity-60 text-slate-400">{item.id}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowAviatorHistoryModal(false)} 
                                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-xs uppercase font-mono flex-shrink-0"
                                >
                                    Close History
                                </button>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM LOTTERY BET SHEET */}
                    {isBetSheetOpen && (
                        <div className="absolute inset-0 bg-black/80 z-[100] flex flex-col justify-end font-sans backdrop-blur-sm">
                            <div className="bg-[#0f172a] rounded-t-[2rem] p-5 space-y-4 border-t border-slate-800 text-white safe-bottom animate-slide-up">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Select: <strong className="text-amber-400 uppercase text-sm ml-1">{betValue}</strong></span>
                                    <button onClick={() => setIsBetSheetOpen(false)} className="text-slate-400 hover:text-white">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                    {[10, 50, 100, 500].map(amt => (
                                        <button key={amt} onClick={() => setSelectedUnit(amt)} className={`py-2 rounded-xl text-xs font-bold border transition-all ${selectedUnit === amt ? 'bg-amber-400 text-slate-950 border-amber-400 font-black' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>৳{amt}</button>
                                    ))}
                                </div>
                                <div className="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800">
                                    <span className="text-xs text-slate-400">Multiplier:</span>
                                    <div className="flex items-center space-x-2">
                                        {[1, 5, 10, 20].map(m => (
                                            <button key={m} onClick={() => setBetMultiplier(m)} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${betMultiplier === m ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>X{m}</button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={handleConfirmLotteryBet} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green cursor-pointer">
                                    Confirm Bet (৳{selectedUnit * betMultiplier})
                                </button>
                            </div>
                        </div>
                    )}

                    {/* PHOTO UPLOAD & AVATAR PICKER MODAL */}
                    {showAvatarModal && (
                        <div className="absolute inset-0 bg-black/85 z-[1050] flex flex-col items-center justify-center p-4 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border border-amber-500/50 rounded-3xl p-5 text-white space-y-3.5 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="text-sm font-black text-amber-300 font-mono">প্রোফাইল ছবি পরিবর্তন</h3>
                                    <button onClick={() => setShowAvatarModal(false)} className="text-slate-400 hover:text-white">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-3 bg-amber-500/10 border border-amber-400/30 rounded-2xl text-center space-y-2">
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        ref={fileInputRef} 
                                        onChange={(e) => {
                                            const file = e.target.files[0];
                                            if (!file) return;
                                            const reader = new FileReader();
                                            reader.onload = (event) => {
                                                const compressed = event.target.result;
                                                if (currentUser) {
                                                    const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                    db.ref('users/' + san).update({ avatar: compressed });
                                                    setCurrentUser(p => ({ ...p, avatar: compressed }));
                                                    setShowAvatarModal(false);
                                                    showToast('প্রোফাইল ছবি আপডেট হয়েছে!', 'success');
                                                }
                                            };
                                            reader.readAsDataURL(file);
                                        }} 
                                        className="hidden" 
                                    />
                                    <button 
                                        type="button" 
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black text-xs uppercase font-mono flex items-center justify-center space-x-2 shadow-neon-gold active:scale-95 transition-all cursor-pointer"
                                    >
                                        <Icon name="upload" className="w-4 h-4" />
                                        <span>মোবাইল গ্যালারি থেকে ছবি দিন</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BIG WIN POPUP */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1300] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md animate-fade-in">
                            <div className="relative w-full max-w-sm glass-panel-glow border-2 border-amber-400/80 rounded-3xl p-6 text-center shadow-2xl overflow-hidden">
                                <div className="text-5xl mb-2">🏆</div>
                                <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 font-mono">
                                    WINNING CASHOUT!
                                </h2>
                                <div className="p-3 bg-black/60 rounded-2xl border border-amber-400/40 my-3">
                                    <span className="text-3xl font-black text-yellow-300 font-mono block">
                                        ৳{formatMoney(popupAmount)}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => setShowResultPopup(false)} 
                                    className="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-gold cursor-pointer"
                                >
                                    Collect Winnings
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
