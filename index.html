        const formatMoney = (val) => {
            const num = Number(val);

        const formatClockTime = (timestampMs) => {
            const d = new Date(timestampMs);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
        };

        const generateIndependentHistory = (prefix, durationSec, count = 20) => {
            const list = [];
            const now = Date.now();
            for (let i = 0; i < count; i++) {
                const roundTime = now - (i * durationSec * 1000);
                const dig = Math.floor(Math.random() * 10);
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const d3 = Math.floor(Math.random() * 6) + 1;
                const sum = d1 + d2 + d3;
                list.push({
                    period: `20260903${prefix}${String(70000 - i)}`,
                    time: formatClockTime(roundTime),
                    number: dig,
                    size: dig >= 5 ? 'Big' : 'Small',
                    color: dig === 0 ? 'violet-red' : (dig === 5 ? 'violet-green' : ([1,3,7,9].includes(dig) ? 'green' : 'red')),
                    dice: [d1, d2, d3],
                    sum: sum,
                    k3Size: sum >= 11 ? 'Big' : 'Small'
                });
            }
            return list;
        };

        // Aviator Canvas Renderer
        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 8.5));
                    const startX = 20;
                    const startY = height - 20;
                    const cpX = width * 0.45;
                    const cpY = height - 20;
                    const targetX = startX + (width - 70) * Math.min(1, progress * 1.1 + 0.1);
                    const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.05);

                    if (phase === 'flying' || phase === 'crashed') {
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.45)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        ctx.save();
                        ctx.strokeStyle = '#e51e38';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 8);
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(16, 0);
                            ctx.quadraticCurveTo(6, -7, -8, -6);
                            ctx.lineTo(-11, -9);
                            ctx.lineTo(-9, -2);
                            ctx.lineTo(-11, 2);
                            ctx.lineTo(-9, 9);
                            ctx.lineTo(-8, 6);
                            ctx.quadraticCurveTo(6, 7, 16, 0);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />;
        };

                    if (snap.exists() && snap.val()) {
                        const timestamp = snap.val();
                        if (timestamp > lastForceCrashTimeRef.current) {
                            lastForceCrashTimeRef.current = timestamp;
                            setAviatorPhase(curr => curr === 'flying' ? 'crashed' : curr);
                        }
                    }
                });

                return () => {
                    targetRef.off();
                    forceRef.off();
                };
            }, []);

            // Generate Aviator Live Bettors
            const generateNewRoundBettors = () => {
                const count = Math.floor(Math.random() * 5) + 12;
                const shuffled = [...LIVE_BOT_NAMES].sort(() => 0.5 - Math.random());
                const list = [];
                for (let i = 0; i < count; i++) {
                    const stake = [20, 50, 100, 200, 500, 1000][Math.floor(Math.random() * 6)];
                    const targetCashout = parseFloat((1.15 + Math.random() * 3.5).toFixed(2));
                    list.push({
                        username: shuffled[i % shuffled.length],
                        stake: stake,
                        targetCashout: targetCashout,
                        cashedOut: false
                    });
                }
                setLiveBettors(list);
            };

            // Aviator Game Loop
            useEffect(() => {
                let avInterval;
                if (aviatorPhase === 'waiting') {
                    generateNewRoundBettors();
                    avInterval = setInterval(() => {
                        setAviatorCountdown(prev => {
                            if (prev <= 1) {
                                setAviatorPhase('flying');
                                setAviatorMult(1.00);

                                let nextCrash;
                                if (adminTargetRef.current && adminTargetRef.current >= 1.00) {
                                    nextCrash = adminTargetRef.current;

                                }
                                setAviatorCrashPoint(nextCrash);
                                return 8;
                            }
                            return prev - 1;

                                <div className="grid grid-cols-2 gap-1.5 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                                    {['1m', '3m'].map(t => (
                                        <button key={t} onClick={() => setK3Tab(t)} className={`py-2 text-[11px] font-black rounded-xl cursor-pointer ${k3Tab === t ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}>{t.toUpperCase()}</button>
                                    ))}
                                </div>

                                <div className="glass-panel p-4 rounded-3xl border border-amber-500/40 flex justify-between items-center font-mono relative overflow-hidden">
                                    <div>
                                        <span className="text-[10px] text-slate-400 block uppercase">K3 LOTTERY {k3Tab.toUpperCase()}</span>
                                        <span className="text-xs font-bold text-amber-300">Dice Draw Clock:</span>
                                    </div>
                                    <span className={`text-3xl font-black ${timers[`k3_${k3Tab}`] <= 5 ? 'text-rose-500 animate-ping' : 'text-yellow-400'}`}>
                                        {Math.floor(timers[`k3_${k3Tab}`] / 60)}:{String(timers[`k3_${k3Tab}`] % 60).padStart(2, '0')}
                                    </span>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setBetModal({ show: true, game: 'k3', mode: k3Tab, selection: 'Big', odds: 2.0, baseStake: 10, multiplier: 1 })} className="bg-amber-500 text-slate-950 py-3 rounded-2xl font-black text-xs uppercase shadow cursor-pointer">Big (11-18) 2X</button>
                                    <button onClick={() => setBetModal({ show: true, game: 'k3', mode: k3Tab, selection: 'Small', odds: 2.0, baseStake: 10, multiplier: 1 })} className="bg-sky-600 text-white py-3 rounded-2xl font-black text-xs uppercase shadow cursor-pointer">Small (3-10) 2X</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
