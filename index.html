        const playSoundEffect = (type) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;

                if (type === 'spin') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(460, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'clack') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(260, now);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);

        const AviatorFlightCanvas = ({ phase, multiplier }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;

                const width = (canvas.width = canvas.parentElement.clientWidth);
                const height = (canvas.height = canvas.parentElement.clientHeight);

                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    const progress = Math.min(1, Math.max(0, (multiplier - 1.0) / 8.0));
                    const startX = 20;
                    const startY = height - 20;
                    const cpX = width * 0.45;
                    const cpY = height - 20;
                    const targetX = startX + (width - 70) * Math.min(1, progress * 1.15 + 0.08);
                    const targetY = startY - (height - 60) * Math.min(0.92, Math.pow(progress, 0.85) + 0.05);

                    if (phase === 'flying' || phase === 'crashed') {
                        ctx.save();
                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, height);
                        fillGrad.addColorStop(0, 'rgba(229, 30, 56, 0.35)');
                        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.lineTo(targetX, height);
                        ctx.lineTo(startX, height);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                        ctx.restore();

                        ctx.save();
                        ctx.shadowColor = '#e51e38';
                        ctx.shadowBlur = 15;
                        ctx.strokeStyle = '#e51e38';
                        ctx.lineWidth = 3.5;
                        ctx.beginPath();
                        ctx.moveTo(startX, startY);
                        ctx.quadraticCurveTo(cpX, cpY, targetX, targetY);
                        ctx.stroke();
                        ctx.restore();

                        if (phase === 'flying') {
                            ctx.save();
                            ctx.translate(targetX, targetY);
                            ctx.rotate(-Math.PI / 7);
                            ctx.shadowColor = '#e51e38';
                            ctx.shadowBlur = 12;
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(14, 0);
                            ctx.quadraticCurveTo(5, -6, -7, -5);

                            ctx.lineTo(-8, -2);
                            ctx.lineTo(-10, 2);
                            ctx.lineTo(-8, 8);
                            ctx.lineTo(-7, 5);
                            ctx.quadraticCurveTo(5, 6, 14, 0);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                    }
                    animId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animId);
            }, [phase, multiplier]);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none z-10" />;
        };

                                    {/* Top Lucky Wheel Feature Bar */}
                                    <div className="relative rounded-2xl bg-gradient-to-r from-[#211100] via-[#4d2800] to-[#120800] border-2 border-yellow-500/80 p-2.5 shadow-lg flex items-center justify-between overflow-hidden flex-shrink-0">
                                        <div className="relative w-20 h-20 -my-2 flex items-center justify-center flex-shrink-0">
                                            <div 
                                                style={{ transform: `rotate(${wheelDegrees}deg)`, transition: isWheelSpinning ? 'transform 3.5s cubic-bezier(0.1, 0.9, 0.2, 1)' : 'none' }}
                                                className="w-24 h-24 rounded-full border-4 border-yellow-400 bg-gradient-to-tr from-yellow-600 via-amber-400 to-yellow-700 shadow-neon-gold relative flex items-center justify-center"
                                            >
                                                <div className="text-[8px] font-black text-slate-950 font-mono">10,000X</div>
                                            </div>
                                            <div className="absolute top-0 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[10px] border-t-yellow-300 z-10" />
                                        </div>

                                        <div className="flex-1 pl-3 space-y-1">
                                            <div className="flex items-center justify-between text-[11px] font-black">
                                                <span className="text-yellow-300 font-mono">Bet <strong className="text-white text-xs">5</strong> unlock</span>
                                                <span className="bg-emerald-700/80 text-emerald-200 border border-emerald-400 text-[8px] px-1.5 py-0.5 rounded font-mono">SCATTER</span>
                                            </div>
                                            <div className="flex items-center justify-between text-[11px] font-black">
                                                <span className="text-amber-300 font-mono">Bet <strong className="text-white text-xs">1</strong> unlock</span>
                                                <div className="flex space-x-1">
                                                    <span className="bg-emerald-800 text-white text-[8px] px-1 rounded font-mono">2X</span>
                                                    <span className="bg-purple-800 text-white text-[8px] px-1 rounded font-mono">5X</span>
                                                    <span className="bg-blue-800 text-white text-[8px] px-1 rounded font-mono">RESPIN</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 3D Cabinet */}
                                    <div className="relative rounded-3xl p-3 bg-gradient-to-b from-[#2b1800] via-[#522d00] to-[#1a0e00] border-4 border-yellow-400 shadow-2xl flex flex-col justify-center my-2">
                                        <div className="text-center pb-1.5">
                                            <h1 className="text-lg font-black text-red-500 uppercase jili-logo-title tracking-wider">Money Coming</h1>
                                        </div>

                                        <div className="grid grid-cols-4 gap-1 bg-black/90 p-1.5 rounded-2xl border-2 border-yellow-500 shadow-inner">
                                            <div className={`h-28 rounded-xl jili-drum-green flex items-center justify-center ${isSlotSpinning ? 'anim-slot-spinning' : ''}`}>
                                                <span className="text-4xl font-black jili-text-gold">{reels[0] || '—'}</span>
                                            </div>
                                            <div className={`h-28 rounded-xl jili-drum-green flex items-center justify-center ${isSlotSpinning ? 'anim-slot-spinning' : ''}`}>
                                                <span className="text-4xl font-black jili-text-gold">{reels[1] || '—'}</span>
                                            </div>
                                            <div className={`h-28 rounded-xl jili-drum-green flex items-center justify-center ${isSlotSpinning ? 'anim-slot-spinning' : ''}`}>
                                                <span className="text-4xl font-black jili-text-gold">{reels[2] || '—'}</span>
                                            </div>
                                            <div className={`h-28 rounded-xl jili-drum-gold flex flex-col items-center justify-center ${isSlotSpinning ? 'anim-slot-spinning' : ''}`}>
                                                {specialReel === 'SCATTER' ? (
                                                    <span className="text-2xl animate-bounce">🎡</span>
                                                ) : specialReel === 'RESPIN' ? (
                                                    <span className="text-2xl animate-pulse">🔄</span>
                                                ) : (
                                                    <span className="text-2xl font-black text-white font-mono bg-purple-700/90 px-2 py-1 rounded-xl shadow-lg border border-purple-300">{specialReel || '—'}</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Controls */}
                                    <div className="bg-[#0d2112] rounded-2xl border border-yellow-600/40 p-2.5 flex items-center justify-between flex-shrink-0">
                                        <div className="flex flex-col">
                                            <span className="text-[10px] text-slate-300 font-bold uppercase">Balance</span>
                                            <span className="text-xs sm:text-sm font-black text-white font-mono">৳{formatMoney(balance)}</span>
                                        </div>

                                        <div className="relative">
                                            <button onClick={() => setIsBetSelectorOpen(!isBetSelectorOpen)} className="px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-950 font-black text-xs font-mono shadow-md">
                                                Bet <strong>৳{moneyComingBet}</strong>
                                            </button>
                                            {isBetSelectorOpen && (
                                                <div className="absolute bottom-12 left-1/2 -translate-x-1/2 bg-black/95 border-2 border-yellow-400 rounded-xl p-1 shadow-2xl flex flex-col divide-y divide-slate-800 z-50 w-24">
                                                    {[100, 50, 10, 5, 1].map(b => (
                                                        <button key={b} onClick={() => { setMoneyComingBet(b); setIsBetSelectorOpen(false); }} className={`py-2 text-xs font-mono font-black ${moneyComingBet === b ? 'bg-amber-500 text-slate-950' : 'text-slate-200'}`}>৳{b}</button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex items-center space-x-2">
                                            <button onClick={() => setIsTurbo(!isTurbo)} className={`w-8 h-8 rounded-full flex items-center justify-center text-xs border ${isTurbo ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>⚡</button>
                                            <button onClick={() => spinJiliMoneyComing(false)} disabled={isSlotSpinning} className="w-14 h-14 rounded-full bg-gradient-to-tr from-green-700 via-emerald-400 to-green-500 border-2 border-yellow-300 text-slate-950 font-black shadow-neon-green flex items-center justify-center flex-col disabled:opacity-60 cursor-pointer">
                                                <span className="text-xs font-black jili-logo-title">SPIN</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 4. BKASH DEPOSIT VIEW */}
                        {view === 'deposit' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0 font-sans">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800 flex-shrink-0">
                                    <button onClick={() => setView('home')} className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-amber-400">Back</button>
                                    <h1 className="text-sm font-bold text-slate-100">bKash Deposit</h1>
                                    <div className="flex space-x-1 font-mono text-xs">
                                        <button onClick={() => setDepositTab('new')} className={`px-2.5 py-1 rounded-xl font-bold ${depositTab === 'new' ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Recharge</button>
                                        <button onClick={() => setDepositTab('history')} className={`px-2.5 py-1 rounded-xl font-bold ${depositTab === 'history' ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-400'}`}>Records</button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3 min-h-0 pb-16">
                                    {depositTab === 'new' ? (
                                        <>
                                            <div className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2">
                                                <span className="text-[9.5px] text-slate-400 font-bold uppercase tracking-wider block">
                                                    Official bKash Agent Receiver Number:
                                                </span>
                                                <div className="p-3 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-between">
                                                    <span className="text-xs sm:text-sm font-black text-amber-300 font-mono select-all">
                                                        01860909272
                                                    </span>
                                                    <button 
                                                        onClick={() => copyToClipboard('01860909272', 'bKash Agent Number copied!')} 
                                                        className="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 rounded-xl text-[10px] font-black shadow-neon-gold"
                                                    >
                                                        Copy
                                                    </button>
                                                </div>
                                            </div>

                                            <form onSubmit={submitBkashDeposit} className="glass-panel p-3.5 rounded-3xl border border-slate-800 space-y-2.5">
                                                <div className="grid grid-cols-4 gap-1.5 font-mono">
                                                    {['200', '500', '1000', '5000'].map(val => (
                                                        <button type="button" key={val} onClick={() => setDepositAmount(val)} className={`py-1.5 rounded-xl border text-xs font-bold ${depositAmount === val ? 'bg-pink-600 text-white border-pink-400 font-black' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>৳{val}</button>
                                                    ))}
                                                </div>
                                                <input type="number" placeholder="Deposit Amount (Min ৳100)" value={depositAmount} onChange={e => setDepositAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                                <input type="tel" placeholder="Sender bKash Number" value={senderNumber} onChange={e => setSenderNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white"/>
                                                <input type="text" placeholder="Transaction ID / TxID" value={transactionId} onChange={e => setTransactionId(e.target.value.toUpperCase())} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono uppercase text-white"/>
                                                
                                                <button type="submit" className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black text-xs uppercase shadow-neon-pink cursor-pointer">
                                                    Submit Deposit (৳{depositAmount})
                                                </button>
                                            </form>
                                        </>
                                    ) : (
                                        <div className="space-y-2">
                                            {depositHistory.map((item, idx) => (
                                                <div key={idx} className="p-3 bg-slate-900 rounded-2xl border border-slate-800 space-y-1 text-xs font-mono">
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-black text-pink-400">৳{formatMoney(item.amount)}</span>
                                                        <span className="px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">{item.status}</span>
                                                    </div>
                                                    <div className="text-[10px] text-slate-400 flex justify-between">
                                                        <span>TxID: {item.txid}</span>
                                                        <span>Sender: {item.sender}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 5. BKASH WITHDRAW VIEW */}
                        {view === 'withdraw' && (
                            <div className="flex-1 flex flex-col bg-[#05070e] justify-between overflow-hidden min-h-0 font-sans">
                                <div className="bg-[#0b101c] px-4 py-3 flex items-center justify-between border-b border-slate-800 flex-shrink-0">
                                    <button onClick={() => setView('home')} className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-amber-400">Back</button>
                                    <h1 className="text-sm font-bold text-slate-100">bKash Withdrawal</h1>
                                    <span></span>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5 min-h-0 pb-16">
                                    <div className="glass-panel p-4 rounded-3xl border border-slate-800 space-y-2">
                                        <span className="text-xs text-slate-400 font-bold uppercase">Withdrawable Balance:</span>
                                        <span className="text-2xl font-black text-emerald-400 font-mono block">৳{formatMoney(balance)}</span>
                                    </div>

                                    <form onSubmit={submitBkashWithdrawal} className="space-y-3">
                                        <input type="number" placeholder="Enter Amount (Min ৳300)" value={withdrawAmount} onChange={e => setWithdrawAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <input type="tel" placeholder="Receiver bKash Number" value={withdrawNumber} onChange={e => setWithdrawNumber(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3 px-4 text-xs font-mono text-white" />
                                        <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 font-black rounded-2xl text-xs uppercase shadow-neon-green cursor-pointer">
                                            Confirm Cashout
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* PHOTO UPLOAD & AVATAR PICKER MODAL */}
                    {showAvatarModal && (
                        <div className="absolute inset-0 bg-black/85 z-[1050] flex flex-col items-center justify-center p-4 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel border border-amber-500/50 rounded-3xl p-5 text-white space-y-3.5 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <h3 className="text-sm font-black text-amber-300 font-mono">প্রোফাইল ছবি পরিবর্তন</h3>
                                    <button onClick={() => setShowAvatarModal(false)} className="text-slate-400 hover:text-white">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-3 bg-amber-500/10 border border-amber-400/30 rounded-2xl text-center space-y-2">
                                    <input 
                                        type="file" 
                                        accept="image/*" 
                                        ref={fileInputRef} 
                                        onChange={(e) => {
                                            const file = e.target.files[0];
                                            if (!file) return;
                                            const reader = new FileReader();
                                            reader.onload = (event) => {
                                                const compressed = event.target.result;
                                                if (currentUser) {
                                                    const san = currentUser.phone.replace(/[^0-9]/g, "");
                                                    db.ref('users/' + san).update({ avatar: compressed });
                                                    setCurrentUser(p => ({ ...p, avatar: compressed }));
                                                    setShowAvatarModal(false);
                                                    showToast('প্রোফাইল ছবি আপডেট হয়েছে!', 'success');
                                                }
                                            };
                                            reader.readAsDataURL(file);
                                        }} 
                                        className="hidden" 
                                    />
                                    <button 
                                        type="button" 
                                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-black text-xs uppercase font-mono flex items-center justify-center space-x-2 shadow-neon-gold active:scale-95 transition-all cursor-pointer"
                                    >
                                        <Icon name="upload" className="w-4 h-4" />
                                        <span>মোবাইল গ্যালারি থেকে ছবি দিন</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* JILI SPLASH SCREEN */}
                    {showJiliSplash && (
                        <div className="absolute inset-0 bg-black z-[2000] flex flex-col items-center justify-center animate-fade-in">
                            <span className="text-5xl font-black text-yellow-400 jili-logo-title tracking-widest animate-pulse">JILI</span>
                            <div className="w-32 h-1 bg-slate-800 rounded-full mt-4 overflow-hidden">
                                <div className="w-full h-full bg-yellow-400 animate-slide-left"></div>
                            </div>
                        </div>
                    )}

                    {/* INTRO PROMPT MODAL */}
                    {showIntroPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1500] flex flex-col items-center justify-center p-4 backdrop-blur-md">
                            <div className="relative w-full max-w-sm rounded-3xl bg-gradient-to-b from-[#2b1000] via-[#592700] to-[#1a0800] border-2 border-yellow-400 p-5 text-center shadow-2xl space-y-4">
                                <div className="flex justify-between items-center text-xs text-amber-300 font-bold">
                                    <span>Volatility: 🌶️🌶️🌶️🌶️🌶️</span>
                                    <span className="text-red-500 font-black jili-logo-title">Money Coming</span>
                                </div>
                                <div className="bg-purple-900/80 rounded-2xl p-4 border border-purple-400/40 flex flex-col items-center space-y-2">
                                    <h3 className="text-lg font-black text-yellow-300 font-mono uppercase">Free Prizes !</h3>
                                    <div className="text-4xl">🎁</div>
                                    <p className="text-xs text-slate-200 font-semibold">Completed Daily mission & Get Rich Card!</p>
                                </div>
                                <button onClick={() => setShowIntroPopup(false)} className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-slate-950 font-black text-xs uppercase rounded-xl shadow-neon-green">Continue</button>
                            </div>
                        </div>
                    )}

                    {/* BIG WIN POPUP */}
                    {showResultPopup && (
                        <div className="absolute inset-0 bg-black/85 z-[1600] flex flex-col items-center justify-center p-5 font-sans backdrop-blur-md">
                            <div className="relative w-full max-w-sm glass-panel-glow border-2 border-amber-400 rounded-3xl p-6 text-center shadow-2xl space-y-3">
                                <div className="text-5xl">🏆</div>
                                <h2 className="text-2xl font-black text-yellow-400 font-mono">BIG WIN!</h2>
                                <span className="text-3xl font-black text-white font-mono block">৳{formatMoney(popupAmount)}</span>
                                <button onClick={() => setShowResultPopup(false)} className="w-full py-3 bg-amber-400 text-slate-950 font-black rounded-xl text-xs uppercase font-mono shadow-neon-gold">Collect Winnings</button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
